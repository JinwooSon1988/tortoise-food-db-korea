<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>성장 기록 | 거북밥 DB Korea</title><meta name="description" content="육지거북의 체중과 등갑직선길이(SCL)를 개체별로 기록한다."><style>body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;max-width:820px;margin:auto;padding:20px;line-height:1.55;color:#17231b;background:#f7f9f6}a{color:inherit}input,button{font-size:16px;padding:10px;border:1px solid #ccd6cd;border-radius:10px;background:#fff}button{min-height:44px;cursor:pointer}.card{background:#fff;border:1px solid #dce4dc;border-radius:14px;padding:14px;margin:12px 0}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row label{display:block}.row input{width:100%;box-sizing:border-box;margin-top:4px}.warn{padding:12px;background:#fff7df;border:1px solid #ecd48f;border-radius:12px}.small{font-size:13px;color:#647067}table{width:100%;border-collapse:collapse;background:#fff}td,th{border-bottom:1px solid #e3e8e3;padding:9px;text-align:left}.danger{border-color:#d8a7a7}@media(max-width:620px){body{padding:14px}.row{grid-template-columns:1fr}table{font-size:14px}}</style><link rel="manifest" href="../manifest.webmanifest"></head><body><p><a href="../index.html">← 거북밥 DB</a> · <a href="../profile/">내 거북</a> · <a href="../monthly/">30일 보기</a></p><h1>성장 기록</h1><div id="profile" class="card"></div><p class="warn">체중과 SCL은 관찰 기록이다. 성장 속도의 정상·이상 여부를 자동 진단하지 않는다. 같은 저울·비슷한 시간대·같은 측정법으로 반복하면 비교가 쉬워진다.</p><div class="card"><div class="row"><label>날짜<input type="date" id="date"></label><label>체중 (g)<input type="number" id="weight" min="0" step="0.1" inputmode="decimal"></label><label>SCL (mm)<input type="number" id="scl" min="0" step="0.1" inputmode="decimal"></label></div><label>메모<input id="note" maxlength="120" placeholder="예: 월간 정기측정" style="width:100%;box-sizing:border-box;margin-top:4px"></label><p><button id="add">측정값 저장</button></p><div id="msg" class="small" aria-live="polite"></div></div><div id="summary"></div><div id="rows"></div><script src="../profile-context.js"></script><script>
const KEY='tfd_growth_v1',PKEY='tfd_profiles_v46';
function localISO(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function id(){return crypto.randomUUID?crypto.randomUUID():'g-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
function active(){return window.TFDProfiles?.active?.()||null}
function updateProfileWeight(profile,weight){if(!profile||weight==null)return;try{const a=JSON.parse(localStorage.getItem(PKEY)||'[]');const i=a.findIndex(x=>x.id===profile.id);if(i>=0){a[i].weight_g=weight;localStorage.setItem(PKEY,JSON.stringify(a))}}catch(e){}}
function render(){const p=active(),pe=document.getElementById('profile');if(!p){pe.innerHTML='<b>현재 거북이 선택되지 않았다.</b><br><a href="../profile/">프로필을 먼저 등록·선택해 달라.</a>';document.getElementById('summary').innerHTML='';document.getElementById('rows').innerHTML='';return}pe.innerHTML='<b>현재 거북:</b> '+esc(p.name||'현재 거북')+' · '+esc(p.species_name||p.species||'')+'<br><span class="small">측정값은 이 개체 ID에만 연결된다.</span>';const a=load().filter(x=>x.profile_id===p.id).sort((x,y)=>y.date.localeCompare(x.date));if(!a.length){document.getElementById('summary').innerHTML='<div class="card">아직 성장 기록이 없다.</div>';document.getElementById('rows').innerHTML='';return}const latest=a[0],oldest=a[a.length-1];let bits=['기록 '+a.length+'회'];if(latest.weight_g!=null)bits.push('최근 체중 '+latest.weight_g+'g');if(latest.scl_mm!=null)bits.push('최근 SCL '+latest.scl_mm+'mm');if(a.length>=2&&latest.weight_g!=null&&oldest.weight_g!=null)bits.push('최초 기록 대비 체중 변화 '+(latest.weight_g-oldest.weight_g).toFixed(1)+'g');document.getElementById('summary').innerHTML='<div class="card"><b>기록 요약</b><br>'+bits.map(esc).join(' · ')+'<br><span class="small">변화량은 측정치 차이이며 건강판정이 아니다.</span></div>';document.getElementById('rows').innerHTML='<table><thead><tr><th>날짜</th><th>체중</th><th>SCL</th><th>메모</th><th></th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+(x.weight_g!=null?esc(x.weight_g)+'g':'-')+'</td><td>'+(x.scl_mm!=null?esc(x.scl_mm)+'mm':'-')+'</td><td>'+esc(x.note||'')+'</td><td><button class="danger" data-id="'+esc(x.event_id)+'">삭제</button></td></tr>').join('')+'</tbody></table>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{save(load().filter(x=>x.event_id!==b.dataset.id));render()})}
document.getElementById('date').value=localISO();document.getElementById('add').onclick=()=>{const p=active(),msg=document.getElementById('msg');if(!p){msg.textContent='현재 거북 프로필을 먼저 선택해야 한다.';return}const date=document.getElementById('date').value,w=document.getElementById('weight').value,s=document.getElementById('scl').value,n=document.getElementById('note').value.trim();if(!date||(!w&&!s)){msg.textContent='날짜와 체중 또는 SCL 중 하나 이상을 입력해야 한다.';return}const weight=w?Number(w):null,scl=s?Number(s):null;if((weight!=null&&weight<=0)||(scl!=null&&scl<=0)){msg.textContent='측정값은 0보다 커야 한다.';return}const a=load();a.push({event_id:id(),date,profile_id:p.id,weight_g:weight,scl_mm:scl,note:n});save(a);if(weight!=null)updateProfileWeight(p,weight);msg.textContent='측정값을 저장했다.';document.getElementById('weight').value='';document.getElementById('scl').value='';document.getElementById('note').value='';render()};render();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));
</script></body></html>
