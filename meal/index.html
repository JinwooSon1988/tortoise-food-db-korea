<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘 식단 빠른 분석 | 거북밥 DB Korea</title><meta name="description" content="육지거북에게 오늘 줄 식물 조합을 선택하고 검증상태를 확인한 뒤 최근 7일 기록에 저장한다.">
<style>body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;max-width:820px;margin:auto;padding:20px;line-height:1.6;color:#17231b;background:#f7f9f6}a{color:inherit}select,button{font-size:16px;padding:10px;margin:4px;border:1px solid #ccd6cd;border-radius:10px;background:#fff}button{min-height:44px;cursor:pointer}.card{background:#fff;border:1px solid #dce4dc;border-radius:14px;padding:14px;margin:12px 0}.warn{background:#fff7df;padding:12px;border:1px solid #ecd48f;border-radius:12px}.small{font-size:13px;color:#647067}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row select{flex:1;min-width:220px}.pill{display:inline-block;border:1px solid #dce4dc;border-radius:999px;padding:4px 8px;margin:2px;font-size:13px;background:#fff}button,a,select,input{touch-action:manipulation}@media(max-width:520px){body{padding:14px}.card{overflow-wrap:anywhere}.row{display:block}.row select,.row button{width:100%;margin:4px 0}}</style><link rel="manifest" href="../manifest.webmanifest"></head><body>
<p><a href="../index.html">← 거북밥 DB</a> · <a href="../weekly/">최근 7일 기록</a> · <a href="../profile/">내 거북</a></p>
<h1>오늘 식단 빠른 분석</h1>
<div id="profileContext" class="card"></div>
<p class="warn">이 기능은 ‘완벽한 식단 점수’를 만들지 않는다. 선택한 식물의 현재 공개 근거 상태와 구성 다양성을 보여준다. 기록 기능은 선택한 <b>식물 종류</b>만 저장하며 급여량(g)이나 영양적 완전성을 계산하지 않는다.</p>
<div class="card"><div class="row"><select id="food" aria-label="식물 선택"><option value="">식물 목록 불러오는 중…</option></select><button id="add">추가</button><button id="clear">초기화</button></div></div>
<div id="result" aria-live="polite"></div>
<div class="card"><button id="record">오늘 식단에 기록</button> <a href="../weekly/">최근 7일 보기</a><div id="recordStatus" class="small" aria-live="polite"></div></div>
<script src="../profile-context.js"></script><script>
const WEEKLY_KEY='tfd_weekly_v1';
let plants=[],assessments=[],meal=[],names={};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localISO(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function makeId(){return crypto.randomUUID?crypto.randomUUID():'e-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function activeProfile(){return window.TFDProfiles?.active?.()||null}
function updateProfile(){const p=activeProfile(),el=document.getElementById('profileContext');if(!p){el.innerHTML='<b>현재 거북:</b> 미지정<br><span class="small"><a href="../profile/">내 거북을 등록</a>하면 기록을 개체별로 연결한다. 지금 기록하면 미지정 기록으로 저장된다.</span>';return}const bits=[p.species_name||p.species,p.stage,p.weight_g?`${p.weight_g}g`:null].filter(Boolean);el.innerHTML='<b>현재 거북:</b> '+esc(p.name||'현재 거북')+(bits.length?' · '+bits.map(esc).join(' · '):'')+'<br><span class="small">오늘 기록은 이 개체 ID에 연결된다.</span>'}
function preferredAssessment(id){return assessments.find(a=>a.plant_id===id&&a.species_group==='Mediterranean_Testudo')||assessments.find(a=>a.plant_id===id&&['Tortoise_general','Herbivorous_reptile_general'].includes(a.species_group))||null}
function publicStatus(id){const a=preferredAssessment(id);if(!a)return '⚪ 검증 미완료';if(id==='dandelion'&&a.verdict==='supported_mixed_diet')return '🟢 혼합급여 적합';const map={supported_mixed_diet:'🟡 혼합급여 지지근거 있음',limited_mixed_diet:'🟡 제한적 혼합급여 근거',limited_supplement:'🟡 제한적 보조식 근거',supplement_general_evidence:'🟡 일반 보조식 근거',general_reptile_supplement:'🟡 일반 초식 파충류 보조근거'};return map[a.verdict]||'⚪ 판단보류 / 근거 부족'}
function render(){updateProfile();const el=document.getElementById('result'),unique=[...new Set(meal)];if(!unique.length){el.innerHTML='<p>아직 선택한 식물이 없다.</p>';return}const rows=unique.map(id=>({id,status:publicStatus(id)}));const green=rows.filter(x=>x.status.includes('🟢')).length,yellow=rows.filter(x=>x.status.includes('🟡')).length,hold=unique.length-green-yellow;el.innerHTML='<h2>선택 '+unique.length+'종</h2>'+rows.map(x=>'<div class="card"><b>'+esc(names[x.id]||x.id)+'</b><br>'+esc(x.status)+'<br><a href="../plant/'+encodeURIComponent(x.id)+'/">근거·주의사항 보기</a> <button data-remove="'+esc(x.id)+'">제거</button></div>').join('')+'<div class="card"><b>구성 요약</b><br>🟢 '+green+'종 · 🟡 '+yellow+'종 · ⚪ '+hold+'종<br><span class="small">종수는 다양성 관찰값일 뿐 안전성·영양적 완전성 점수가 아니다.</span></div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{meal=meal.filter(x=>x!==b.dataset.remove);render()})}
function loadWeekly(){try{const a=JSON.parse(localStorage.getItem(WEEKLY_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveWeekly(a){localStorage.setItem(WEEKLY_KEY,JSON.stringify(a))}
function recordMeal(){const unique=[...new Set(meal)],out=document.getElementById('recordStatus');if(!unique.length){out.textContent='먼저 식물을 1종 이상 선택해야 한다.';return}const date=localISO(),p=activeProfile(),pid=p?p.id:null,a=loadWeekly();let added=0,skipped=0;for(const food of unique){const exists=a.some(x=>x.date===date&&x.food===food&&(x.profile_id||null)===(pid||null));if(exists){skipped++;continue}a.push({event_id:makeId(),date,food,profile_id:pid});added++}saveWeekly(a);out.innerHTML='<span class="pill">'+esc(date)+'</span> '+(p?'<span class="pill">'+esc(p.name||'현재 거북')+'</span> ':'<span class="pill">미지정</span> ')+'<b>'+added+'종 기록</b>'+(skipped?' · 이미 기록된 '+skipped+'종 건너뜀':'')+' · <a href="../weekly/">7일 기록 확인</a>'}
async function init(){try{const [p,a]=await Promise.all([fetch('../data/plants.json').then(r=>{if(!r.ok)throw new Error('plants');return r.json()}),fetch('../data/assessments.json').then(r=>{if(!r.ok)throw new Error('assessments');return r.json()})]);plants=p.filter(x=>x.id);assessments=Array.isArray(a)?a:[];for(const x of plants)names[x.id]=x.ko||x.id;document.getElementById('food').innerHTML=plants.map(x=>'<option value="'+esc(x.id)+'">'+esc(names[x.id])+'</option>').join('')}catch(e){document.getElementById('food').innerHTML='<option value="">식물 목록을 불러오지 못함</option>'}render()}
document.getElementById('add').onclick=()=>{const x=document.getElementById('food').value;if(x&&!meal.includes(x))meal.push(x);render()};
document.getElementById('clear').onclick=()=>{meal=[];document.getElementById('recordStatus').textContent='';render()};
document.getElementById('record').onclick=recordMeal;
init();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));
</script></body></html>
