name: Plant intake queue QA
on:
  pull_request:
  push:
    paths:
      - 'data/plant_intake_queue_v1.json'
      - 'data/plants.json'
      - 'scripts/qa_plant_intake_queue_v1.py'
      - '.github/workflows/plant-intake-queue-qa.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/qa_plant_intake_queue_v1.py
