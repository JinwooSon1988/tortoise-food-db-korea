name: Plant-first species evidence UI QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'plant-detail-v56.js'
      - 'language-toggle.js'
      - 'scripts/qa_animal_selector_ui_v1.py'
      - '.github/workflows/animal-selector-ui-qa.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/qa_animal_selector_ui_v1.py
