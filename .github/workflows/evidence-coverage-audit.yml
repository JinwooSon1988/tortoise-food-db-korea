name: Evidence Coverage Audit
on:
  pull_request:
  push:
    branches: [main]
jobs:
  evidence-coverage-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/audit_public_evidence_coverage.py
