name: Language switch regression audit

on:
  pull_request:
    paths:
      - 'scripts/audit_language_switch_links.py'
      - 'plant/**'
      - 'en/**'
      - 'guides/research-method/**'
      - 'scripts/en_hubs.py'
      - '.github/workflows/language-switch-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bilingual navigation links
        run: python scripts/audit_language_switch_links.py
