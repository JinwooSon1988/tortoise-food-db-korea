name: Meal weekly flow QA
on:
  pull_request:
    paths:
      - 'meal/**'
      - 'weekly/**'
      - 'profile-context.js'
      - 'sw.js'
      - 'scripts/audit_meal_weekly_flow.py'
      - '.github/workflows/meal-weekly-flow.yml'
  push:
    branches: [main]
    paths:
      - 'meal/**'
      - 'weekly/**'
      - 'profile-context.js'
      - 'sw.js'
      - 'scripts/audit_meal_weekly_flow.py'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/audit_meal_weekly_flow.py
