name: Sync generated pages for PR 303

on:
  push:
    branches:
      - fix/nutrition-reference-state-detail-20261013
    paths:
      - .github/workflows/sync-generated-pages-pr303.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'JinwooSon1988/tortoise-food-db-korea'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate canonical static pages
        run: |
          python scripts/generate_static_pages.py
          python scripts/patch_curated_social_metadata.py
          python scripts/inject_plant_detail_v56.py
          python scripts/generate_guide_hubs.py
          python scripts/generate_en_pages.py
      - name: Validate regenerated output
        run: |
          python scripts/qa_variety_card_regeneration_v1.py
          python scripts/audit_plant_detail_v56.py
          python scripts/qa_english_site_v1.py
      - name: Commit generated files on PR branch only
        run: |
          git add -- 'plant/*/index.html' 'en/**' 'guides/**' sitemap.xml data/i18n/en/catalog_en.json
          if git diff --cached --quiet; then
            echo "Generated pages already match committed output."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: synchronize generated plant and English pages'
          git push origin HEAD:fix/nutrition-reference-state-detail-20261013
