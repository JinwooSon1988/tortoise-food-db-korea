name: Parallel scholarly metadata discovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/discover_research_sources_epmc.py'
      - 'scripts/discover_tortoise_diet_literature.py'
      - 'scripts/triage_tortoise_diet_leads.py'
      - 'scripts/match_diet_titles_to_plant_catalog.py'
      - 'tests/test_match_diet_titles_to_plant_catalog.py'
      - 'tests/test_triage_tortoise_diet_leads.py'
      - 'tests/test_discover_tortoise_diet_literature.py'
      - 'tests/test_epmc_metadata_http_errors.py'
      - 'tests/test_epmc_discovery_circuit_breaker.py'
      - 'scripts/audit_offline_botanical_source_titles.py'
      - 'tests/test_audit_offline_botanical_source_titles.py'
      - 'scripts/check_pmc_fulltext_parallel.py'
      - 'tests/test_pmc_fulltext_availability.py'
      - 'tests/test_pmc_retry_merge.py'
      - 'tests/test_pmc_xml_cache.py'
      - 'scripts/extract_jats_botanical_mentions.py'
      - 'tests/test_extract_jats_botanical_mentions.py'
      - 'tests/test_pmc_extraction_retries.py'
      - 'scripts/join_botanical_mentions_to_public_plants.py'
      - 'tests/test_join_botanical_mentions_to_public_plants.py'
      - 'scripts/prioritize_botanical_review_leads.py'
      - 'tests/test_prioritize_botanical_review_leads.py'
      - 'data/plants.json'
      - 'data/research_unique_source_review_queue.json'
      - '.github/workflows/parallel-source-discovery.yml'
permissions:
  contents: read
jobs:
  diet-literature:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test targeted tortoise diet literature discovery without network
        run: python -m unittest discover -s tests -p test_discover_tortoise_diet_literature.py -v
      - name: Test bulk title triage without network
        run: python -m unittest discover -s tests -p test_triage_tortoise_diet_leads.py -v
      - name: Test batch botanical title-to-catalog joins without network
        run: python -m unittest discover -s tests -p test_match_diet_titles_to_plant_catalog.py -v
      - name: Search 18 tortoise feeding research queries with 6 bounded workers
        run: python scripts/discover_tortoise_diet_literature.py --workers 6 --out /tmp/tortoise_diet_literature_unverified.json
      - name: Deduplicate and triage all discovered diet leads without safety inference
        if: always()
        run: |
          if test -s /tmp/tortoise_diet_literature_unverified.json; then
            python scripts/triage_tortoise_diet_leads.py --input /tmp/tortoise_diet_literature_unverified.json --output /tmp/tortoise_diet_title_triage.json
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/tortoise_diet_title_triage.json').read_text())
          assert sum(d['counts'].values())==d['deduplicated_titles']
          assert all(row['feeding_safety_status']=='unassessed' and not row['verified_plant_links']
                     for group in d['groups'].values() for row in group)
          print('PASS: title triage preserves unverified status')
          PY
            python scripts/match_diet_titles_to_plant_catalog.py --triage /tmp/tortoise_diet_title_triage.json --plants data/plants.json --out /tmp/tortoise_diet_catalog_title_leads.json
          fi
      - name: Preserve unverified diet research leads even on provider errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geobukbap-targeted-tortoise-diet-literature
          path: |
            /tmp/tortoise_diet_literature_unverified.json
            /tmp/tortoise_diet_title_triage.json
            /tmp/tortoise_diet_catalog_title_leads.json
          retention-days: 30
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated PMC XML across discovery runs
        uses: actions/cache/restore@v4
        with:
          path: /tmp/geobukbap-pmc-xml-cache
          key: pmc-xml-v1-${{ hashFiles('data/research_unique_source_review_queue.json') }}-${{ github.run_id }}
          restore-keys: |
            pmc-xml-v1-${{ hashFiles('data/research_unique_source_review_queue.json') }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test DOI parsing and no-safety behavior
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('d','scripts/discover_research_sources_epmc.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          assert m.DOI_RE.match('https://doi.org/10.1371/journal.pone.0116716')
          assert m.DOI_RE.match('https://dx.doi.org/10.1002/ece3.70585')
          assert not m.DOI_RE.match('https://example.com/test')
          assert m.normalize_title('  Desert Tortoises: Food! ')=='desert tortoises food'
          r=m.lookup({'source_url':'https://example.com/test','title':'','taxon_associations':[]})
          assert r['discovery_status']=='non_doi_no_title'
          assert r['feeding_safety_status']=='unassessed'
          assert r['plant_associations_verified']==0
          print('PASS: DOI parsing and fail-closed non-DOI handling')
          PY
      - name: Test Europe PMC HTTP diagnostics and bounded retries without network
        run: python -m unittest discover -s tests -p test_epmc_metadata_http_errors.py -v
      - name: Test Europe PMC uniform-outage circuit breaker without network
        run: python -m unittest discover -s tests -p test_epmc_discovery_circuit_breaker.py -v
      - name: Test offline title relevance auditing without network
        run: python -m unittest discover -s tests -p test_audit_offline_botanical_source_titles.py -v
      - name: Test JATS XML validation without network
        run: python -m unittest discover -s tests -p test_pmc_fulltext_availability.py -v
      - name: Test selective PMC retry merge without network
        run: python -m unittest discover -s tests -p test_pmc_retry_merge.py -v
      - name: Test PMC XML cache reuse without network
        run: python -m unittest discover -s tests -p test_pmc_xml_cache.py -v
      - name: Test botanical name extraction without network
        run: python -m unittest discover -s tests -p test_extract_jats_botanical_mentions.py -v
      - name: Test bounded transient PMC retries without network
        run: python -m unittest discover -s tests -p test_pmc_extraction_retries.py -v
      - name: Test exact botanical catalog joins without network
        run: python -m unittest discover -s tests -p test_join_botanical_mentions_to_public_plants.py -v
      - name: Test deterministic botanical review prioritization
        run: python -m unittest discover -s tests -p test_prioritize_botanical_review_leads.py -v
      - name: Query Europe PMC for all unique sources with 12 bounded workers
        run: python scripts/discover_research_sources_epmc.py --workers 12 --out /tmp/geobukbap-epmc-discovery.json
      - name: Fail closed when Europe PMC discovery is unavailable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/geobukbap-epmc-discovery.json").read_text())
          errors=d["status_counts"].get("lookup_error",0)
          matched=d["matched_sources"]
          total=d["total_sources"]
          assert matched > 0, "No Europe PMC metadata matches: discovery unavailable; do not report success"
          assert errors * 2 < total, f"Excessive Europe PMC lookup errors: {errors}/{total}"
          print(f"PASS: metadata matches={matched}, lookup errors={errors}")
          PY
      - name: Verify exact coverage and no automatic safety promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/geobukbap-epmc-discovery.json').read_text())
          q=json.loads(Path('data/research_unique_source_review_queue.json').read_text())
          assert d['total_sources']==len(q['records'])==582
          assert {x['source_url'] for x in d['records']}=={x['source_url'] for x in q['records']}
          assert sum(d['status_counts'].values())==582
          unmatched=json.loads(Path('/tmp/epmc_unmatched_sources.json').read_text())
          fulltext=json.loads(Path('/tmp/epmc_full_text_candidates.json').read_text())
          assert d['unmatched_sources']==unmatched['count']==len(unmatched['records'])
          assert d['pmc_full_text_candidates']==fulltext['count']==len(fulltext['records'])
          assert d['matched_sources']+d['unmatched_sources']==582
          assert all(x.get('pmcid') for x in fulltext['records'])
          assert all(x['feeding_safety_status']=='unassessed' and x['plant_associations_verified']==0 for x in d['records'])
          print('PASS: 582/582 sources represented, no feeding safety promotions')
          PY
      - name: Check PMC full-text XML availability in 8 bounded workers
        run: python scripts/check_pmc_fulltext_parallel.py --workers 8 --cache-dir /tmp/geobukbap-pmc-xml-cache --candidates /tmp/epmc_full_text_candidates.json --out /tmp/epmc_fulltext_availability.json
      - name: Report validated PMC XML cache reuse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/epmc_fulltext_availability.json').read_text())
          hits=sum(bool(r.get('cache_hit')) for r in d['records'])
          print(f'PMC XML cache hits: {hits}/{d["total_candidates"]}',flush=True)
          assert all(r['status']=='full_text_xml_available'
                     for r in d['records'] if r.get('cache_hit'))
          PY
      - name: Retry only transient PMC XML failures with 4 workers
        run: |
          python scripts/check_pmc_fulltext_parallel.py --workers 4 --cache-dir /tmp/geobukbap-pmc-xml-cache --candidates /tmp/epmc_full_text_candidates.json --retry-errors-from /tmp/epmc_fulltext_availability.json --out /tmp/epmc_fulltext_availability_retried.json
          mv /tmp/epmc_fulltext_availability_retried.json /tmp/epmc_fulltext_availability.json
      - name: Save validated PMC XML before quality gate
        uses: actions/cache/save@v4
        with:
          path: /tmp/geobukbap-pmc-xml-cache
          key: pmc-xml-v1-${{ hashFiles('data/research_unique_source_review_queue.json') }}-${{ github.run_id }}
      - name: Audit full-text availability coverage and zero safety inference
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          candidates=json.loads(Path('/tmp/epmc_full_text_candidates.json').read_text())
          checked=json.loads(Path('/tmp/epmc_fulltext_availability.json').read_text())
          assert checked['total_candidates']==candidates['count']
          assert {r['source_url'] for r in checked['records']}=={r['source_url'] for r in candidates['records']}
          assert sum(checked['status_counts'].values())==candidates['count']
          assert all(r['feeding_safety_status']=='unassessed' and r['plant_associations_verified']==0 for r in checked['records'])
          print('PASS: full-text availability coverage with no feeding-safety inference')
          PY
      - name: Extract unverified botanical mentions in 6 bounded workers
        run: python scripts/extract_jats_botanical_mentions.py --workers 6 --cache-dir /tmp/geobukbap-pmc-xml-cache --fulltext-availability /tmp/epmc_fulltext_availability.json --out /tmp/epmc_botanical_mentions_unverified.json
      - name: Audit extracted candidates are not promoted as feeding evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/epmc_botanical_mentions_unverified.json').read_text())
          a=json.loads(Path('/tmp/epmc_fulltext_availability.json').read_text())
          assert x['sources_attempted']==a['status_counts'].get('full_text_xml_available',0)
          assert x['candidate_mentions']==len(x['candidates'])
          assert x['sources_scanned']+x['sources_failed']==x['sources_attempted']
          assert len(x['failed_sources'])==x['sources_failed']
          assert all(1 <= r['attempts'] <= 3 for r in x['failed_sources'])
          assert all(r['feeding_observation_status']=='not_verified' and r['feeding_safety_status']=='unassessed' and not r['verified_plant_links'] for r in x['candidates'])
          print('PASS: botanical name mentions remain unverified, never public safety evidence')
          PY
      - name: Match all botanical mention candidates to public catalog
        run: python scripts/join_botanical_mentions_to_public_plants.py --mentions /tmp/epmc_botanical_mentions_unverified.json --plants data/plants.json --out /tmp/epmc_botanical_catalog_review_leads.json
      - name: Audit exact catalog joins remain unverified
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/epmc_botanical_catalog_review_leads.json').read_text())
          m=json.loads(Path('/tmp/epmc_botanical_mentions_unverified.json').read_text())
          assert x['total_mentions']==m['candidate_mentions']
          assert sum(x['match_counts'].values())==x['total_mentions']
          assert all(r['feeding_observation_status']=='not_verified' and r['feeding_safety_status']=='unassessed' and not r['verified_plant_links'] for r in x['records'])
          print('PASS: exact botanical catalog leads are unverified, never feeding evidence')
          PY
      - name: Deduplicate catalog-linked botanical source/name review pairs
        run: python scripts/prioritize_botanical_review_leads.py --joined /tmp/epmc_botanical_catalog_review_leads.json --out /tmp/epmc_botanical_prioritized_review.json
      - name: Audit source-title relevance without promoting feeding evidence
        run: python scripts/audit_offline_botanical_source_titles.py --discovery /tmp/geobukbap-epmc-discovery.json --prioritized /tmp/epmc_botanical_prioritized_review.json --out /tmp/epmc_botanical_title_review.json
      - name: Report title-relevant tortoise feeding evidence yield
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/epmc_botanical_title_review.json').read_text())
          counts=d['signal_counts']
          feeding=counts.get('tortoise_diet_title',0)
          total=d['review_pairs']
          print(f'Tortoise feeding/diet title review leads: {feeding}/{total}',flush=True)
          if feeding==0:
              print('WARNING: Zero title-relevant feeding studies; botanical co-occurrences must not be reported as diet evidence.',flush=True)
          assert sum(counts.values())==total
          PY
      - name: Audit review pairs cannot become safety evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/epmc_botanical_prioritized_review.json').read_text())
          assert x['review_pairs']==len(x['records'])
          assert all(r['review_status']=='not_reviewed' and r['feeding_observation_status']=='not_verified' and r['feeding_safety_status']=='unassessed' and not r['verified_plant_links'] for r in x['records'])
          print('PASS: prioritized source/name review pairs remain unverified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geobukbap-epmc-582-source-metadata
          path: |
            /tmp/geobukbap-epmc-discovery.json
            /tmp/epmc_unmatched_sources.json
            /tmp/epmc_full_text_candidates.json
            /tmp/epmc_fulltext_availability.json
            /tmp/epmc_botanical_mentions_unverified.json
            /tmp/epmc_botanical_catalog_review_leads.json
            /tmp/epmc_botanical_prioritized_review.json
            /tmp/epmc_botanical_title_review.json
          retention-days: 30
      - name: Fail closed on severe PMC availability degradation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/epmc_fulltext_availability.json').read_text())
          total=data['total_candidates']
          available=data['status_counts'].get('full_text_xml_available',0)
          errors=data['status_counts'].get('request_error',0)
          from collections import Counter
          http_codes=Counter(str(r.get('http_status','network_or_unknown'))
                             for r in data['records'] if r['status']=='request_error')
          print('PMC XML failure HTTP diagnostics:',dict(sorted(http_codes.items())),flush=True)
          print('PMC XML retry diagnostics:',{
              'attempted':data.get('retry_attempted',0),
              'recovered':data.get('retry_recovered',0),
              'skipped_http_500':data.get('retry_skipped_http_500',0)
          },flush=True)
          assert total > 0, 'No PMC candidates: unavailable provider'
          assert available * 3 >= total * 2, (
              f'PMC XML availability degraded: {available}/{total} accessible, '
              f'{errors} request errors; do not treat this run as a successful corpus refresh'
          )
          print(f'PASS: PMC XML accessible {available}/{total}, errors={errors}')
          PY
