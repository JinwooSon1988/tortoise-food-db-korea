name: Public content coverage QA
on:
  pull_request:
    paths:
      - 'data/plants.json'
      - 'data/plant_nutrition_v56.json'
      - 'data/verified_plant_images_v56.json'
      - 'data/public_content_coverage.json'
      - 'scripts/qa_public_content_coverage.py'
      - '.github/workflows/public-content-coverage-qa.yml'
  push:
    branches: [main]
    paths:
      - 'data/plants.json'
      - 'data/plant_nutrition_v56.json'
      - 'data/verified_plant_images_v56.json'
      - 'data/public_content_coverage.json'
      - 'scripts/qa_public_content_coverage.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python scripts/qa_public_content_coverage.py
      - name: Synchronize materialized coverage
        run: |
          if ! git diff --quiet -- data/public_content_coverage.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/public_content_coverage.json
            git commit -m "chore: synchronize public content coverage"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - name: Verify materialized coverage is current
        run: |
          python scripts/qa_public_content_coverage.py
          git diff --exit-code -- data/public_content_coverage.json
