name: Render plant detail pages

on:
  pull_request:
    paths:
      - 'data/plants.json'
      - 'data/public_assessments.json'
      - 'data/public_evidence_records.json'
      - 'data/curated_identity_notes.json'
      - 'data/verified_plant_images_v56.json'
      - 'data/ibera_direct_feeding_evidence_v56.json'
      - 'data/korean_retail_name_map.json'
      - 'scripts/generate_static_pages.py'
      - 'scripts/patch_curated_social_metadata.py'
      - 'scripts/inject_plant_detail_v56.py'
      - 'scripts/public_verdict.py'
      - 'verdict-core.js'
      - 'index.html'
      - 'scripts/audit_verdict_cards.py'
      - 'scripts/audit_plant_detail_v56.py'
      - 'scripts/qa_verdict_consistency.py'
      - 'plant/**'
      - '.github/workflows/render-plant-pages.yml'
  push:
    branches: [main]
    paths:
      - 'data/plants.json'
      - 'data/public_assessments.json'
      - 'data/public_evidence_records.json'
      - 'data/curated_identity_notes.json'
      - 'data/verified_plant_images_v56.json'
      - 'data/ibera_direct_feeding_evidence_v56.json'
      - 'data/korean_retail_name_map.json'
      - 'scripts/generate_static_pages.py'
      - 'scripts/patch_curated_social_metadata.py'
      - 'scripts/inject_plant_detail_v56.py'
      - 'scripts/public_verdict.py'
      - 'verdict-core.js'
      - 'index.html'
      - 'scripts/audit_verdict_cards.py'
      - 'scripts/audit_plant_detail_v56.py'
      - 'scripts/qa_verdict_consistency.py'
      - 'plant/**'
      - '.github/workflows/render-plant-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate general plant detail pages
        run: python scripts/generate_static_pages.py
      - name: Add discovery metadata to curated pages
        run: python scripts/patch_curated_social_metadata.py
      - name: Strip retired runtime verdict enhancers
        run: python scripts/inject_plant_detail_v56.py
      - name: Audit structural integrity
        run: python scripts/audit_plant_integrity.py
      - name: Audit verdict-card safety invariants
        run: python scripts/audit_verdict_cards.py
      - name: Audit v5.6 detail contract
        run: python scripts/audit_plant_detail_v56.py
      - name: Audit home/detail verdict consistency
        run: python scripts/qa_verdict_consistency.py
      - name: Generate derived coverage artifacts
        run: |
          python scripts/qa_public_content_coverage.py
          python scripts/qa_plant_coverage_gap_report_v1.py
          python scripts/build_wild_candidate_research_queue.py
      - name: Commit synchronized generated pages
        run: |
          if ! git diff --quiet -- plant/ sitemap.xml data/public_content_coverage.json data/plant_coverage_gap_report_v1.json data/wild_candidate_research_queue.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plant/ sitemap.xml data/public_content_coverage.json data/plant_coverage_gap_report_v1.json data/wild_candidate_research_queue.json
            git commit -m "chore: synchronize generated plant pages"
            git push
          fi
      - name: Verify generated pages are current
        run: |
          python scripts/generate_static_pages.py
          python scripts/patch_curated_social_metadata.py
          python scripts/inject_plant_detail_v56.py
          python scripts/qa_public_content_coverage.py
          python scripts/qa_plant_coverage_gap_report_v1.py
          git diff --exit-code -- plant/ sitemap.xml data/public_content_coverage.json data/plant_coverage_gap_report_v1.json data/wild_candidate_research_queue.json
