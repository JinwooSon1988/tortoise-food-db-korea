name: Render plant detail pages

on:
  push:
    branches:
      - main
      - codex/v50-generate-verdict-cards
    paths:
      - 'data/plants.json'
      - 'data/assessments.json'
      - 'data/korean_retail_name_map.json'
      - 'scripts/generate_static_pages.py'
      - 'scripts/audit_verdict_cards.py'
      - '.github/workflows/render-plant-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 66 plant detail pages
        run: python scripts/generate_static_pages.py
      - name: Audit structural integrity
        run: python scripts/audit_plant_integrity.py
      - name: Audit verdict-card safety invariants
        run: python scripts/audit_verdict_cards.py
      - name: Commit generated changes in small batches
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only -- plant/)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'Plant pages already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          batch=0
          for ((i=0; i<${#files[@]}; i+=8)); do
            batch=$((batch+1))
            chunk=("${files[@]:i:8}")
            git add -- "${chunk[@]}"
            git commit -m "Build: plant verdict cards batch ${batch} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          done
