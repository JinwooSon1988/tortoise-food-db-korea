name: Core page stability audit

on:
  pull_request:
    paths:
      - 'scripts/audit_core_page_assets.py'
      - 'index.html'
      - 'en/**'
      - 'plant/**'
      - 'guides/research-method/**'
      - 'language-toggle.js'
      - 'search-live.js'
      - 'language-state-sync.js'
      - 'search-en.js'
      - 'verdict-core.js'
      - 'detail-locale-history.js'
      - '.github/workflows/core-page-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check critical page assets
        run: python scripts/audit_core_page_assets.py
      - name: Check production JavaScript syntax
        run: |
          node --check language-toggle.js
          node --check language-state-sync.js
          node --check detail-locale-history.js
          node --check search-live.js
          node --check en/search-en.js
          node --check verdict-core.js
