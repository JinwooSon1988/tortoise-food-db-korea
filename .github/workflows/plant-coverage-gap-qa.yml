name: Plant coverage gap QA
on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/build_plant_coverage_gap_report_v1.py'
      - 'scripts/qa_plant_coverage_gap_report_v1.py'
      - '.github/workflows/plant-coverage-gap-qa.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/qa_plant_coverage_gap_report_v1.py
      - name: Synchronize coverage gap report
        run: |
          if ! git diff --quiet -- data/plant_coverage_gap_report_v1.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/plant_coverage_gap_report_v1.json
            git commit -m "chore: synchronize plant coverage gap report"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - name: Verify coverage gap report is current
        run: |
          python scripts/qa_plant_coverage_gap_report_v1.py
          git diff --exit-code --ignore-space-at-eol data/plant_coverage_gap_report_v1.json
