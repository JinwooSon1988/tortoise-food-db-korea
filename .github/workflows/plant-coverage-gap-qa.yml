name: Plant coverage gap QA
on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/build_plant_coverage_gap_report_v1.py'
      - 'scripts/qa_plant_coverage_gap_report_v1.py'
      - '.github/workflows/plant-coverage-gap-qa.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/qa_plant_coverage_gap_report_v1.py
      - run: git diff --exit-code --ignore-space-at-eol data/plant_coverage_gap_report_v1.json
