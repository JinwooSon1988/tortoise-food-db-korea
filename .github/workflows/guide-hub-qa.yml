name: Guide hub QA
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/generate_guide_hubs.py
      - name: Report generated guide changes without mutating PR branch
        run: |
          if git diff --quiet -- guides sitemap.xml; then
            echo "guide hubs already synchronized"
          else
            echo "::warning::Generated guide hubs differ from committed files; inspect and commit via a dedicated change."
            git diff --stat -- guides sitemap.xml
          fi
      - run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          for slug in ('market-foods','wild-plants','caution-foods','research-method'):
              p=root/'guides'/slug/'index.html'
              assert p.exists(), p
              s=p.read_text(encoding='utf-8')
              required = ('적용 범위:','근거 확실성:','목록에 포함됐다는 사실 자체가 급여 권장을 뜻하지 않는다','근거 부족을 안전으로 간주하지 않는다') if slug != 'research-method' else ('식물부터 정확히 확인','무슨 부위인가','근거의 적용 범위','근거가 약하면 약하다고 표시','Merck Veterinary Manual','근거 확실성은 급여 등급과 다르다')
              for x in required:
                  assert x in s,(slug,x)
          print('guide hub QA passed')
          PY
