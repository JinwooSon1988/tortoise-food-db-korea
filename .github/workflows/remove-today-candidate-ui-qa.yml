name: Remove dead today-candidate UI QA
on:
  pull_request:
    paths:
      - 'core-foods/index.html'
      - 'scripts/qa_remove_today_candidates_ui.py'
      - '.github/workflows/remove-today-candidate-ui-qa.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/qa_remove_today_candidates_ui.py
