name: Research nutrition gap queue QA
on:
  pull_request:
    paths:
      - 'research/nutrition_69_gap_queue_20261016.json'
      - 'scripts/qa_nutrition_69_research_queue.py'
      - 'data/plants.json'
      - 'data/plant_nutrition_v56.json'
      - 'data/plant_nutrition_reference_v1.json'
      - 'data/plant_identity_registry_v1.json'
      - '.github/workflows/research-nutrition-gap-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-queue-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate unlinked nutrition research queue
        run: python scripts/qa_nutrition_69_research_queue.py
