name: Global taxonomy intake sample
on:
  pull_request:
    paths:
      - 'scripts/import_gbif_global_taxa.py'
      - 'scripts/audit_publication_readiness.py'
      - '.github/workflows/global-taxonomy-intake-sample.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch 20000 global plant taxonomic candidates
        run: |
          python scripts/import_gbif_global_taxa.py --limit 1000 --pages 20 --output research/generated/gbif_global_taxa_sample.json
          python - <<'PY'
          import json
          p = json.load(open("research/generated/gbif_global_taxa_sample.json", encoding="utf-8"))
          n = len(p["candidates"])
          print(f"ACTUAL TAXONOMY CANDIDATES: {n}")
          assert n > 0, "No global taxonomic candidates retrieved"
          assert all(x["feeding_verdict"] is None for x in p["candidates"])
          PY
      - name: Link taxonomy candidates to existing assessment and evidence inventory
        run: |
          python scripts/audit_publication_readiness.py --taxonomy-batch research/generated/gbif_global_taxa_sample.json --output research/generated/publication_readiness_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: gbif-global-taxonomy-candidates
          path: |
            research/generated/gbif_global_taxa_sample.json
            research/generated/publication_readiness_audit.json
          retention-days: 14
