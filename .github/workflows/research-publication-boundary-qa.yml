name: Research publication boundary QA
on:
  pull_request:
    paths:
      - 'data/research/plant_candidates_v1.json'
      - 'data/research/tortoise_plant_evidence_v1.json'
      - 'scripts/qa_global_research_publication_boundaries.py'
      - '.github/workflows/research-publication-boundary-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/qa_global_research_publication_boundaries.py
