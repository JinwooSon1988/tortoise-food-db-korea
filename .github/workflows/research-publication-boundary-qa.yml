name: Research publication boundary QA
on:
  pull_request:
    paths:
      - 'data/research/**'
      - 'scripts/build_global_plant_evidence_research_v1.py'
      - 'docs/GLOBAL_RESEARCH_EXISTING_SPECIES_REVIEW_20261014.md'
      - 'scripts/qa_global_research_existing_species_review.py'
      - 'scripts/qa_global_research_new_candidate_triage.py'
      - 'docs/GLOBAL_RESEARCH_NEW_CANDIDATE_TRIAGE_20261014.md'
      - 'docs/GLOBAL_RESEARCH_EVIDENCE_QUALITY_BOTTLENECKS_20261014.md'
      - 'scripts/qa_global_research_evidence_quality_counts.py'
      - 'scripts/qa_global_research_publication_boundaries.py'
      - '.github/workflows/research-publication-boundary-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/qa_global_research_publication_boundaries.py
      - run: python scripts/qa_global_research_existing_species_review.py
      - run: python scripts/qa_global_research_new_candidate_triage.py
      - run: python scripts/qa_global_research_evidence_quality_counts.py
