name: Nutrition v5.6 QA

on:
  pull_request:
    paths:
      - 'data/plant_nutrition_v56.json'
      - 'data/nutrition_gap_workqueue_v3.json'
      - 'scripts/qa_bellpepper_candidate_gate.py'
      - 'scripts/qa_usda_bellpepper_verified_csv.py'
      - 'scripts/qa_usda_lettuce_public_table.py'
      - 'data/usda_lettuce_variety_nutrition_20261008.json'
      - 'plant/lettuce/index.html'
      - 'scripts/qa_bellpepper_evidence_conflict.py'
      - 'data/bellpepper_feeding_evidence_reassessment_20261008.json'
      - 'plant/bellpepper/index.html'
      - 'data/usda_bellpepper_original_csv_verified_20261008.json'
      - 'data/plants.json'
      - 'scripts/audit_nutrition_v56.py'
      - 'data/nutrition_hold_list_v1.json'
      - 'data/nutrition_coverage_audit_v1.json'
      - 'scripts/qa_nutrition_hold_list_v1.py'
      - 'scripts/build_nutrition_coverage_audit_v1.py'
      - 'data/plant_nutrition_dm_basis_v1.json'
      - 'data/nutrition_global_research_log_v1.json'
      - 'scripts/qa_nutrition_dm_basis_v1.py'
      - 'data/academic_flower_nutrition_sources_20261009.json'
      - 'scripts/build_academic_flower_nutrition_v1.py'
      - '.github/workflows/nutrition-v56-qa.yml'
  push:
    branches: [main]
    paths:
      - 'data/plant_nutrition_v56.json'
      - 'data/nutrition_gap_workqueue_v3.json'
      - 'scripts/qa_bellpepper_candidate_gate.py'
      - 'scripts/qa_usda_bellpepper_verified_csv.py'
      - 'scripts/qa_usda_lettuce_public_table.py'
      - 'data/usda_lettuce_variety_nutrition_20261008.json'
      - 'plant/lettuce/index.html'
      - 'scripts/qa_bellpepper_evidence_conflict.py'
      - 'data/bellpepper_feeding_evidence_reassessment_20261008.json'
      - 'plant/bellpepper/index.html'
      - 'data/usda_bellpepper_original_csv_verified_20261008.json'
      - 'data/plants.json'
      - 'scripts/audit_nutrition_v56.py'
      - 'data/nutrition_hold_list_v1.json'
      - 'data/nutrition_coverage_audit_v1.json'
      - 'scripts/qa_nutrition_hold_list_v1.py'
      - 'scripts/build_nutrition_coverage_audit_v1.py'
      - 'data/plant_nutrition_dm_basis_v1.json'
      - 'data/nutrition_global_research_log_v1.json'
      - 'scripts/qa_nutrition_dm_basis_v1.py'
      - 'data/academic_flower_nutrition_sources_20261009.json'
      - 'scripts/build_academic_flower_nutrition_v1.py'
      - '.github/workflows/nutrition-v56-qa.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit nutrition registry
        run: python scripts/audit_nutrition_v56.py
      - name: Block premature bell pepper nutrition promotion
        run: python scripts/qa_bellpepper_candidate_gate.py
      - name: Audit original USDA pepper nutrition evidence
        run: python scripts/qa_usda_bellpepper_verified_csv.py
      - name: Check lettuce public nutrition against original USDA records
        run: python scripts/qa_usda_lettuce_public_table.py
      - name: Preserve pepper feeding evidence conflict
        run: python scripts/qa_bellpepper_evidence_conflict.py
      - name: Verified-or-held partition and provenance
        run: python scripts/qa_nutrition_hold_list_v1.py
      - name: Peer-reviewed flower records equal the published tables
        run: python scripts/build_academic_flower_nutrition_v1.py
      - name: Dry-matter registry and worldwide research log
        run: python scripts/qa_nutrition_dm_basis_v1.py
      - name: Coverage audit is current
        run: |
          python scripts/build_nutrition_coverage_audit_v1.py
          git diff --exit-code data/nutrition_coverage_audit_v1.json
