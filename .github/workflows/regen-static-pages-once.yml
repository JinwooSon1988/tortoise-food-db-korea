name: Regenerate static plant pages once

on:
  pull_request:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate all master plant pages
        run: python scripts/generate_static_pages.py
      - name: Commit generated pages when stale
        shell: bash
        run: |
          if git diff --quiet -- plant; then
            echo "Plant pages already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plant
          git commit -m "SEO: regenerate all 69 plant pages"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
