name: Ibera candidate identity QA

on:
  pull_request:
    paths:
      - 'data/ibera_field_food_candidates.json'
      - 'scripts/audit_ibera_candidates.py'
      - '.github/workflows/ibera-candidate-audit.yml'
  push:
    branches: [main]
    paths:
      - 'data/ibera_field_food_candidates.json'
      - 'scripts/audit_ibera_candidates.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_ibera_candidates.py
