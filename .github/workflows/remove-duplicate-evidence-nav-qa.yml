name: Duplicate evidence navigation QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/qa_remove_duplicate_evidence_nav.py'
      - '.github/workflows/remove-duplicate-evidence-nav-qa.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/qa_remove_duplicate_evidence_nav.py
