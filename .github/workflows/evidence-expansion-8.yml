name: Evidence expansion 8 QA

on:
  pull_request:
    paths:
      - 'data/assessments.json'
      - 'data/evidence.json'
      - 'data/plants.json'
      - 'plant/alfalfa/index.html'
      - 'plant/dolnamul/index.html'
      - 'scripts/audit_evidence_expansion_8.py'
      - '.github/workflows/evidence-expansion-8.yml'
  push:
    branches: [main]
    paths:
      - 'data/assessments.json'
      - 'data/evidence.json'
      - 'data/plants.json'
      - 'plant/alfalfa/index.html'
      - 'plant/dolnamul/index.html'
      - 'scripts/audit_evidence_expansion_8.py'
      - '.github/workflows/evidence-expansion-8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Medicago / Sedum evidence invariants
        run: python scripts/audit_evidence_expansion_8.py
