name: Deploy GitHub Pages

# Publish every committed plant-language update; keep manual redeploy available.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'plant/**'
      - 'data/plant-catalog/**'
      - 'data/feeding_pending_site_v1.json'
      - 'all-plants/**'
      - 'taxon/**'
      - 'taxonomy-home-search.js'
      - 'en/**'
      - 'index.html'
      - 'detail-locale-history.js'
      - 'language-toggle.js'
      - 'scripts/generate_static_pages.py'
      - 'scripts/generate_en_pages.py'
      - 'scripts/en_hubs.py'
      - 'scripts/qa_english_site_v1.py'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Render canonical plant detail pages
        run: |
          python -m pip install --disable-pip-version-check -q pyyaml
          python scripts/generate_static_pages.py
          python scripts/patch_curated_social_metadata.py
          python scripts/inject_plant_detail_v56.py
          python scripts/generate_guide_hubs.py
          python scripts/generate_en_pages.py
      - name: Block obsolete English homepage sections before deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          home = Path('en/index.html').read_text(encoding='utf-8')
          for obsolete in ('<h2>Guides</h2>',):
              if obsolete in home:
                  raise SystemExit('DEPLOY BLOCKED: obsolete English home section: '+obsolete)
          for required in ('href="../all-plants/?lang=en"', 'href="./guides/research-method/"'):
              if required not in home:
                  raise SystemExit('DEPLOY BLOCKED: missing English home navigation: '+required)
          print('English homepage regression and navigation checks passed')
          PY
      - name: Verify full searchable catalog before upload
        run: |
          python scripts/qa_plant_catalog_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/plant-catalog')
          i=json.loads((p/'index.json').read_text(encoding='utf-8'))
          s=json.loads((p/'search.json').read_text(encoding='utf-8'))
          assert i['count'] >= 22045, i['count']
          assert len(s['rows']) == i['count'], (len(s['rows']),i['count'])
          assert (Path('taxon/index.html')).exists()
          print('Release gate passed:',i['count'],'searchable taxa')
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
