name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # Source-data/generator commits are followed by an Actions-generated
    # plant-page sync commit. Deploy only site-facing files so those source
    # commits do not publish the previous render and then publish again.
    paths:
      - 'plant/**'
      - 'index.html'
      - '404.html'
      - 'assets/**'
      - '*.js'
      - '*.css'
      - 'sitemap.xml'
      - 'scripts/generate_static_pages.py'
      - 'data/plants.json'
      - 'data/public_assessments.json'
      - 'data/public_evidence_records.json'
      - 'robots.txt'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Render canonical plant detail pages
        run: |
          python -m pip install --disable-pip-version-check -q pyyaml
          python scripts/generate_static_pages.py
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
