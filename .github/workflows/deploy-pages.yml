name: Deploy GitHub Pages

# Publish every committed plant-language update; keep manual redeploy available.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'plant/**'
      - 'en/**'
      - 'index.html'
      - 'detail-locale-history.js'
      - 'language-toggle.js'
      - 'scripts/generate_static_pages.py'
      - 'scripts/generate_en_pages.py'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Render canonical plant detail pages
        run: |
          python -m pip install --disable-pip-version-check -q pyyaml
          python scripts/generate_static_pages.py
          python scripts/patch_curated_social_metadata.py
          python scripts/inject_plant_detail_v56.py
          python scripts/generate_guide_hubs.py
          python scripts/generate_en_pages.py
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
