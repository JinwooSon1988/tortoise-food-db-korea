name: Deploy GitHub Pages

# Publish every committed plant-language update; keep manual redeploy available.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'plant/**'
      - 'data/plant-catalog/**'
      - 'data/feeding_pending_site_v1.json'
      - 'all-plants/**'
      - 'taxon/**'
      - 'taxonomy-home-search.js'
      - 'en/**'
      - 'index.html'
      - 'detail-locale-history.js'
      - 'language-toggle.js'
      - 'scripts/generate_static_pages.py'
      - 'scripts/generate_en_pages.py'
      - 'scripts/en_hubs.py'
      - 'scripts/qa_english_site_v1.py'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Render canonical plant detail pages
        run: |
          python -m pip install --disable-pip-version-check -q pyyaml
          python scripts/generate_static_pages.py
          python scripts/patch_curated_social_metadata.py
          python scripts/inject_plant_detail_v56.py
          python scripts/generate_guide_hubs.py
          python scripts/generate_en_pages.py
      - name: Verify English homepage redirects to canonical bilingual home
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('en/index.html').read_text(encoding='utf-8')
          assert 'location.replace("../?lang=en"+location.hash)' in page, 'Legacy English home must redirect'
          assert 'Search for a plant by name. We show whether' not in page, 'Legacy English homepage still rendered'
          guide = Path('en/guides/research-method/index.html').read_text(encoding='utf-8')
          assert 'href="../../../?lang=en" aria-label="Home"' in guide, 'English guide home routes to obsolete page'
          print('Canonical English homepage and guide navigation verified')
          PY
      - name: Verify generated English research wording
        run: |
          python - <<'PY'
          from pathlib import Path
          guide = Path('en/guides/research-method/index.html').read_text(encoding='utf-8')
          for outdated in ('silently swapped in', 'Separate “which part?”', 'Say so when the evidence is weak'):
              assert outdated not in guide, 'Outdated English research wording: ' + outdated
          for required in ('If a source does not reliably identify the plant', 'Check which plant part is involved', 'Make evidence limitations clear'):
              assert required in guide, 'Missing English research wording: ' + required
          print('Generated English research copy verified')
          PY
      - name: Verify full searchable catalog before upload
        run: |
          python scripts/qa_plant_catalog_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/plant-catalog')
          i=json.loads((p/'index.json').read_text(encoding='utf-8'))
          s=json.loads((p/'search.json').read_text(encoding='utf-8'))
          assert i['count'] >= 22045, i['count']
          assert len(s['rows']) == i['count'], (len(s['rows']),i['count'])
          assert (Path('taxon/index.html')).exists()
          print('Release gate passed:',i['count'],'searchable taxa')
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
