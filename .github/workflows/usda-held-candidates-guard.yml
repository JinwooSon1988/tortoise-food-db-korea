name: USDA held candidate guard

on:
  push:
    branches: [main]
    paths:
      - 'data/usda_srlegacy_plant_candidates_batch2_20261008.json'
      - 'data/plant_nutrition_v56.json'
      - 'scripts/audit_usda_held_candidates_ci.py'
      - 'data/korea_taxon_mapping_v1.json'
      - '.github/workflows/usda-held-candidates-guard.yml'
  pull_request:
    paths:
      - 'data/usda_srlegacy_plant_candidates_batch2_20261008.json'
      - 'data/plant_nutrition_v56.json'
      - 'scripts/audit_usda_held_candidates_ci.py'
      - 'data/korea_taxon_mapping_v1.json'
      - '.github/workflows/usda-held-candidates-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-held:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate held source candidates
        run: python scripts/audit_usda_held_candidates_ci.py
