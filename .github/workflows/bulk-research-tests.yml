name: Bulk research tests
on:
  pull_request:
    paths:
      - 'scripts/*bulk_leads.py'
      - 'scripts/*openalex_leads.py'
      - '.github/workflows/bulk-research-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p 'test_*bulk_leads.py' -v
      - run: python -m unittest discover -s scripts -p 'test_merge_openalex_leads.py' -v
