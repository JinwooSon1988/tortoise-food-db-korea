name: Applicability warning QA
on:
  pull_request:
    paths:
      - 'fresh-primary-combo-explain.js'
      - 'data/plants.json'
      - 'data/wild_observation_frequency.json'
      - 'sw.js'
      - 'scripts/audit_applicability_warning.py'
      - '.github/workflows/applicability-warning.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/audit_applicability_warning.py
