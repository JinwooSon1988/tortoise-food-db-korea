name: Applicability filter QA
on:
  pull_request:
    paths:
      - 'candidate-applicability-summary.js'
      - 'fresh-primary-mode.js'
      - 'sw.js'
      - 'scripts/audit_applicability_filter.py'
      - '.github/workflows/applicability-filter.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/audit_applicability_filter.py
