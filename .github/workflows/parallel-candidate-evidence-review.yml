name: Parallel candidate evidence review (research only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/parallel_candidate_evidence_review.py'
      - '.github/workflows/parallel-candidate-evidence-review.yml'
permissions:
  contents: read
concurrency:
  group: parallel-candidate-evidence-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parallel review-only evidence matching
        run: python scripts/parallel_candidate_evidence_review.py --workers 20
      - name: Verify every candidate remains ungraded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('data/evidence-review-shards')
          manifest=json.loads((folder/'index.json').read_text(encoding='utf-8'))
          assert manifest['safety_grades_assigned']==0
          assert manifest['input_legacy']+manifest['input_diverse']==manifest['totals']['candidates']
          assert sum(s['count'] for s in manifest['shards'])==manifest['totals']['candidates']
          for shard in manifest['shards']:
              data=json.loads((folder/shard['file']).read_text(encoding='utf-8'))
              assert data['count']==len(data['records'])==shard['count']
              assert all(row['safety_grade'] is None and row['feeding_safety_status']=='not_assessed'
                         for row in data['records'])
          public=json.loads((folder/'public-evidence-coverage.json').read_text(encoding='utf-8'))
          assert public['count']==len(public['records'])
          assert all(row['safety_grade'] is None and row['feeding_safety_status']=='not_assessed'
                     for row in public['records'])
          assert manifest['join_diagnostics']['public_catalog_rows_audited']==public['count']
          assert sum(row['source_records'] for row in public['records'])==manifest['join_diagnostics']['public_catalog_total_source_records']
          assert sum(row['unique_source_urls'] for row in public['records'])==manifest['join_diagnostics']['public_catalog_unique_source_url_plant_pairs']
          assert sum(row['duplicate_evidence_ids'] for row in public['records'])==manifest['join_diagnostics']['public_catalog_duplicate_evidence_ids']
          assert all(row['unique_source_urls']<=row['source_records'] for row in public['records'])
          print('public plants audited:',public['count'])
          print('public plants with source records:',manifest['join_diagnostics']['public_catalog_rows_with_sources'])
          print('review-only candidates:',manifest['totals']['candidates'])
          print('catalog overlap:',manifest['join_diagnostics']['candidate_reviewed_overlap'])
          print('join warning:',manifest['join_diagnostics'].get('join_warning','none'))
          print('shards:',len(manifest['shards']))
          print('reference matched:',manifest['totals'].get('with_any_reference',0))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-candidate-evidence-review-${{ github.run_id }}
          path: data/evidence-review-shards/
          retention-days: 30
          if-no-files-found: error
