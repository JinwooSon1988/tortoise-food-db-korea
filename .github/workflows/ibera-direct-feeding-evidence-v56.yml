name: Ibera direct feeding evidence v5.6 QA

on:
  pull_request:
    paths:
      - 'data/ibera_direct_feeding_evidence_v56.json'
      - 'scripts/audit_ibera_direct_feeding_evidence_v56.py'
      - '.github/workflows/ibera-direct-feeding-evidence-v56.yml'
  push:
    branches: [main]
    paths:
      - 'data/ibera_direct_feeding_evidence_v56.json'
      - 'scripts/audit_ibera_direct_feeding_evidence_v56.py'
      - '.github/workflows/ibera-direct-feeding-evidence-v56.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit direct Ibera feeding evidence
        run: python scripts/audit_ibera_direct_feeding_evidence_v56.py
