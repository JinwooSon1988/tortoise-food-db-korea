name: Species review consolidation QA

on:
  pull_request:
    paths:
      - 'scripts/consolidate_species_review_queue.py'
      - 'tests/test_consolidate_species_review_queue.py'
      - '.github/workflows/species-review-consolidation-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/consolidate_species_review_queue.py'
      - 'tests/test_consolidate_species_review_queue.py'
      - '.github/workflows/species-review-consolidation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run species review tests
        run: python -m unittest discover -s tests -p 'test_consolidate_species_review_queue.py' -v
