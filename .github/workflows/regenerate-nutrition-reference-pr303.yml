name: Regenerate nutrition reference detail pages PR303 (bilingual)
on:
  push:
    branches: [fix/nutrition-reference-state-detail-20261013]
    paths:
      - '.github/workflows/regenerate-nutrition-reference-pr303.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nutrition-reference-state-detail-20261013
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and commit matching published pages
        run: |
          python -m pip install --disable-pip-version-check -q pyyaml
          python scripts/generate_static_pages.py
          python scripts/patch_curated_social_metadata.py
          python scripts/inject_plant_detail_v56.py
          python scripts/generate_guide_hubs.py
          python scripts/generate_en_pages.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plant/ en/ guides/ sitemap.xml data/i18n/en/catalog_en.json
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate detail pages for nutrition reference states"
            git push origin HEAD:fix/nutrition-reference-state-detail-20261013
          fi
