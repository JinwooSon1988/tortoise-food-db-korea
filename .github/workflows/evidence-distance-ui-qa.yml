name: Evidence distance UI QA
on:
  pull_request:
    paths:
      - 'plant-detail-v56.js'
      - 'plant-detail-v56.css'
      - 'scripts/qa_evidence_distance_ui_v1.py'
      - '.github/workflows/evidence-distance-ui-qa.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/qa_evidence_distance_ui_v1.py
