name: OpenAlex bounded real discovery batch
on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'Zero-based start index in sorted unique taxonomy candidates'
        required: false
        default: '100'
        type: string
      limit:
        description: 'Number of taxa to query (1-200)'
        required: false
        default: '100'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/openalex-real-discovery-batch.yml'
      - 'scripts/research_bulk_leads.py'
      - 'scripts/screen_openalex_tortoise_titles.py'
      - 'scripts/audit_openalex_bulk_leads.py'
permissions:
  contents: read
concurrency:
  group: openalex-real-discovery-batch
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build research-only verified taxonomy CSV
        run: |
          mkdir -p "$RUNNER_TEMP/gb-research"
          printf 'plant_scientific_name\n' > "$RUNNER_TEMP/gb-research/site.csv"
          python scripts/export_candidate_taxonomy_for_research.py data/taxonomy-shards/index.json --site "$RUNNER_TEMP/gb-research/site.csv" --output "$RUNNER_TEMP/gb-research/candidates.csv" --report "$RUNNER_TEMP/gb-research/taxonomy-report.json"
      - name: Record immutable batch scope and provenance
        env:
          BATCH_OFFSET: ${{ inputs.offset || '100' }}
          BATCH_LIMIT: ${{ inputs.limit || '100' }}
        run: |
          printf '{"offset":%s,"limit":%s,"commit":"%s","run_id":"%s","evidence_status":"unreviewed_research_only"}\n' "$BATCH_OFFSET" "$BATCH_LIMIT" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/gb-research/batch-manifest.json"
      - name: Discover next nonoverlapping research batch with bounded API rate
        env:
          BATCH_OFFSET: ${{ inputs.offset || '100' }}
          BATCH_LIMIT: ${{ inputs.limit || '100' }}
        run: |
          if ! [[ "$BATCH_OFFSET" =~ ^[0-9]+$ ]] || ! [[ "$BATCH_LIMIT" =~ ^[0-9]+$ ]] || (( BATCH_LIMIT < 1 || BATCH_LIMIT > 200 )); then
            echo 'Invalid batch offset or limit' >&2
            exit 1
          fi
          python scripts/research_bulk_leads.py --taxa-csv "$RUNNER_TEMP/gb-research/candidates.csv" --workers 4 --request-interval 3 --offset "$BATCH_OFFSET" --limit "$BATCH_LIMIT" --output "$RUNNER_TEMP/gb-research/openalex-leads.jsonl"
      - name: Measure actual results and retry backlog
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/gb-research/openalex-leads.jsonl"; then
            python scripts/audit_openalex_bulk_leads.py "$RUNNER_TEMP/gb-research/openalex-leads.jsonl" --report "$RUNNER_TEMP/gb-research/coverage-report.json"
          fi
      - name: Screen title-only tortoise relevance without promoting feeding verdicts
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/gb-research/openalex-leads.jsonl"; then
            python scripts/screen_openalex_tortoise_titles.py "$RUNNER_TEMP/gb-research/openalex-leads.jsonl" --output "$RUNNER_TEMP/gb-research/title-screening-report.json"
          fi
      - name: Upload research-only evidence leads and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openalex-research-batch-${{ github.run_id }}
          path: ${{ runner.temp }}/gb-research/
          retention-days: 30
          if-no-files-found: error
