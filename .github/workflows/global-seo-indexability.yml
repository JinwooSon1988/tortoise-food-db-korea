name: Global SEO indexability audit

on:
  pull_request:
    paths:
      - 'scripts/audit_global_seo_indexability.py'
      - 'sitemap.xml'
      - 'en/**'
      - 'plant/**'
      - 'index.html'
      - '.github/workflows/global-seo-indexability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit committed indexable pages
        run: python scripts/audit_global_seo_indexability.py
