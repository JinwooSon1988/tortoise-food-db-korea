name: DOI bibliography enrichment (research only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_doi_metadata.py'
      - 'scripts/join_plant_bibliography_leads.py'
      - 'scripts/discover_europepmc_doi.py'
      - 'scripts/triage_published_feeding_evidence.py'
      - '.github/workflows/doi-bibliography-enrichment.yml'
permissions:
  contents: read
jobs:
  bibliography:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all bibliography research scripts before network calls
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          scripts = ('parallel_candidate_evidence_review.py', 'audit_doi_metadata.py', 'join_plant_bibliography_leads.py', 'triage_published_feeding_evidence.py', 'discover_europepmc_doi.py')
          for name in scripts:
              path = Path('scripts') / name
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print(f'Validated Python syntax for {len(scripts)} scripts')
          PY
      - run: python scripts/parallel_candidate_evidence_review.py --workers 20
      - run: python scripts/audit_doi_metadata.py --workers 2 --timeout 8
      - run: python scripts/join_plant_bibliography_leads.py
      - run: python scripts/triage_published_feeding_evidence.py
      - run: python scripts/discover_europepmc_doi.py --workers 2 --timeout 15
      - name: Check metadata integrity and unverified status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('data/evidence-review-shards')
          queue=json.loads((folder/'global-source-review-queue.json').read_text())
          audit=json.loads((folder/'doi-metadata-audit.json').read_text())
          assert audit['count']==queue['count']==len(audit['records'])
          assert [r['source_url'] for r in audit['records']]==[r['source_url'] for r in queue['records']]
          assert sum(audit['summary'].values())==audit['count']
          assert all(r['content_verified'] is False and r['feeding_safety_status']=='not_assessed' for r in audit['records'])
          leads=json.loads((folder/'plant-bibliography-leads.json').read_text())
          assert leads['metadata_found_sources']==audit['summary']['found']
          assert leads['plant_source_links']==sum(len(r['bibliography_leads']) for r in leads['records'])
          assert len({r['plant_id'] for r in leads['records']})==leads['plant_count']
          assert all(x['content_verified'] is False and x['feeding_safety_status']=='not_assessed' for r in leads['records'] for x in r['bibliography_leads'])
          triage=json.loads((folder/'feeding-evidence-triage.json').read_text())
          assert triage['evidence_count']==sum(triage['queue_counts'].values())
          assert triage['evidence_count']==sum(b['evidence_count'] for b in triage['source_batches'])
          assert triage['unique_sources']==sum(b['source_count'] for b in triage['source_batches'])
          assert all(x['content_verified'] is False and x['feeding_safety_status']=='not_assessed' for x in triage['records'])
          epmc=json.loads((folder/'europepmc-doi-discovery.json').read_text())
          assert epmc['count']==audit['count']
          assert sum(epmc['summary'].values())==epmc['count']
          assert all(r['content_verified'] is False and r['feeding_safety_status']=='not_assessed' for r in epmc['records'])
          assert all(r['status']!='exact_doi_match' or r['doi'] for r in epmc['records'])
          batches=json.loads((folder/'bibliography-review-batches.json').read_text())
          assert batches['source_count']==audit['summary']['found']
          assert sum(b['source_count'] for b in batches['batches'])==batches['source_count']
          assert all(1<=b['source_count']<=25 for b in batches['batches'])
          assert len({x['source_url'] for b in batches['batches'] for x in b['records']})==batches['source_count']
          print(audit['summary'])
          print({'plants_with_bibliography':leads['plant_count'],'plant_source_links':leads['plant_source_links']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: doi-bibliography-${{ github.run_id }}
          path: |
            data/evidence-review-shards/doi-metadata-audit.json
            data/evidence-review-shards/plant-bibliography-leads.json
            data/evidence-review-shards/bibliography-review-batches.json
            data/evidence-review-shards/europepmc-doi-discovery.json
            data/evidence-review-shards/feeding-evidence-triage.json
          retention-days: 30
          if-no-files-found: error
