name: Current navigation cleanup QA
on:
  pull_request:
    paths:
      - 'core-foods/index.html'
      - 'index.html'
      - 'scripts/qa_current_nav_cleanup.py'
      - '.github/workflows/current-nav-cleanup-qa.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/qa_current_nav_cleanup.py
