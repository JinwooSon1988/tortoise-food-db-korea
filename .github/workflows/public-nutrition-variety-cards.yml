name: Public nutrition variety cards QA

on:
  push:
    branches: [main]
    paths:
      - 'data/usda_mint_variety_candidates_20261009.json'
      - 'data/plant_nutrition_variety_v1.json'
      - 'plant/mint/index.html'
      - 'plant/lettuce/index.html'
      - 'scripts/generate_static_pages.py'
      - 'scripts/audit_public_nutrition_variety_cards.py'
      - '.github/workflows/public-nutrition-variety-cards.yml'
  pull_request:
    paths:
      - 'data/usda_mint_variety_candidates_20261009.json'
      - 'data/plant_nutrition_variety_v1.json'
      - 'plant/mint/index.html'
      - 'plant/lettuce/index.html'
      - 'scripts/generate_static_pages.py'
      - 'scripts/audit_public_nutrition_variety_cards.py'
      - '.github/workflows/public-nutrition-variety-cards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare public cards to nutrition source records
        run: python scripts/audit_public_nutrition_variety_cards.py
