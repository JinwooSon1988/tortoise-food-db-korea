name: Public nutrition variety cards QA

on:
  push:
    branches: [main]
    paths:
      - 'data/usda_mint_variety_candidates_20261009.json'
      - 'data/plant_nutrition_variety_v1.json'
      - 'data/tagetes_patula_species_nutrition_v1.json'
      - 'data/mentha_species_nutrition_v1.json'
      - 'scripts/build_mentha_species_v1.py'
      - 'data/academic_flower_nutrition_sources_20261009.json'
      - 'scripts/build_tagetes_patula_species_v1.py'
      - 'plant/mint/index.html'
      - 'plant/lettuce/index.html'
      - 'scripts/generate_static_pages.py'
      - 'scripts/audit_public_nutrition_variety_cards.py'
      - 'scripts/qa_variety_card_regeneration_v1.py'
      - 'scripts/patch_curated_social_metadata.py'
      - 'scripts/inject_plant_detail_v56.py'
      - 'data/verified_plant_images_v56.json'
      - 'data/plant_nutrition_v56.json'
      - 'data/public_assessments.json'
      - 'plant/**'
      - '.github/workflows/public-nutrition-variety-cards.yml'
  pull_request:
    paths:
      - 'data/usda_mint_variety_candidates_20261009.json'
      - 'data/plant_nutrition_variety_v1.json'
      - 'data/tagetes_patula_species_nutrition_v1.json'
      - 'data/mentha_species_nutrition_v1.json'
      - 'scripts/build_mentha_species_v1.py'
      - 'data/academic_flower_nutrition_sources_20261009.json'
      - 'scripts/build_tagetes_patula_species_v1.py'
      - 'plant/mint/index.html'
      - 'plant/lettuce/index.html'
      - 'scripts/generate_static_pages.py'
      - 'scripts/audit_public_nutrition_variety_cards.py'
      - 'scripts/qa_variety_card_regeneration_v1.py'
      - 'scripts/patch_curated_social_metadata.py'
      - 'scripts/inject_plant_detail_v56.py'
      - 'data/verified_plant_images_v56.json'
      - 'data/plant_nutrition_v56.json'
      - 'data/public_assessments.json'
      - 'plant/**'
      - '.github/workflows/public-nutrition-variety-cards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # On main pushes the committed pages may lag until "Sync generated plant pages" commits them; render them
      # here so the content checks test this commit's generator output. The committed-page equality check for the
      # published commit runs in final-commit-qa.yml after the sync. Pull requests keep the strict check below.
      - name: Render pages in the runner (push to main)
        if: github.event_name == 'push'
        run: |
          python scripts/generate_static_pages.py
          python scripts/patch_curated_social_metadata.py
          python scripts/inject_plant_detail_v56.py
      - name: Compare public cards to nutrition source records
        run: python scripts/audit_public_nutrition_variety_cards.py
      - name: 페퍼민트·스피어민트 species sections stay consistent and scoped
        run: python scripts/build_mentha_species_v1.py
      - name: 만수국 species cards equal the published tables and stay scoped
        run: python scripts/build_tagetes_patula_species_v1.py
      - name: Card content contracts (push to main; equality is checked by Final commit QA)
        if: github.event_name == 'push'
        run: python scripts/qa_variety_card_regeneration_v1.py --skip-regen
      - name: Regenerated pages must equal committed pages (no hand-only content)
        if: github.event_name != 'push'
        run: python scripts/qa_variety_card_regeneration_v1.py
