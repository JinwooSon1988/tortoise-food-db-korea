name: Temporary PR303 page regeneration
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.number == 303 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - run: python -m pip install -q pyyaml
      - name: Rebuild canonical pages
        run: |
          python scripts/generate_static_pages.py
          python scripts/patch_curated_social_metadata.py
          python scripts/inject_plant_detail_v56.py
          python scripts/generate_guide_hubs.py
          python scripts/generate_en_pages.py
      - name: Commit generated outputs to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plant en guides sitemap.xml data/i18n/en/catalog_en.json
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate plant details from nutrition reference source"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
