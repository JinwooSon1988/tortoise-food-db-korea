name: Evidence-first verdict QA
on:
  pull_request:
    paths:
      - 'scripts/generate_static_pages.py'
      - 'scripts/qa_evidence_first_verdict.py'
      - 'data/plants.json'
      - 'data/public_assessments.json'
      - 'data/plant_nutrition_v56.json'
      - '.github/workflows/evidence-first-verdict-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/qa_evidence_first_verdict.py
