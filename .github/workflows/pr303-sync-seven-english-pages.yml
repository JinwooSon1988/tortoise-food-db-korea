name: PR303 sync seven English plant pages
on:
  push:
    branches:
      - fix/nutrition-reference-state-detail-20261013
    paths:
      - .github/workflows/pr303-sync-seven-english-pages.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nutrition-reference-state-detail-20261013
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pyyaml
      - name: Regenerate Korean and English pages
        run: |
          python scripts/generate_static_pages.py
          python scripts/patch_curated_social_metadata.py
          python scripts/inject_plant_detail_v56.py
          python scripts/generate_guide_hubs.py
          python scripts/generate_en_pages.py
      - name: Commit only the seven stale English detail pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- en/plant/aehobakleaf/index.html en/plant/broadleafplantain/index.html en/plant/buckwheatleaf/index.html en/plant/commonmallow/index.html en/plant/hosta/index.html en/plant/pumpkinleaf/index.html en/plant/sunflowerleaf/index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize seven English nutrition reference detail pages"
            git push origin HEAD:fix/nutrition-reference-state-detail-20261013
          fi
