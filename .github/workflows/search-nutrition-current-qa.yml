name: Search and nutrition current-main QA
on:
  pull_request:
    paths:
      - 'search-live.js'
      - 'plant-detail-v56.js'
      - 'scripts/qa_search_nutrition_current_v1.py'
      - '.github/workflows/search-nutrition-current-qa.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/qa_search_nutrition_current_v1.py
