name: Combo applicability context QA
on:
  pull_request:
    paths:
      - 'combo-applicability-context.js'
      - 'candidate-applicability-summary.js'
      - 'profile-context.js'
      - 'sw.js'
      - 'scripts/audit_combo_applicability_context.py'
      - '.github/workflows/combo-applicability-context.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/audit_combo_applicability_context.py
