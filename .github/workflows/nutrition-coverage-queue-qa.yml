name: Nutrition coverage queue QA
on:
  pull_request:
    paths:
      - 'data/nutrition_coverage_queue_v1.json'
      - 'data/plants.json'
      - 'data/plant_nutrition_v56.json'
      - 'scripts/qa_nutrition_coverage_queue_v1.py'
      - '.github/workflows/nutrition-coverage-queue-qa.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/qa_nutrition_coverage_queue_v1.py
