name: Tortoise literature discovery

on:
  pull_request:
    paths:
      - 'scripts/collect_tortoise_literature_epmc.py'
      - 'tests/test_tortoise_literature_epmc.py'
      - '.github/workflows/tortoise-literature-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run literature discovery regression tests
        run: python -m unittest discover -s tests -p 'test_tortoise_literature_epmc.py'
      - name: Query twelve independent tortoise diet research searches in parallel
        run: python scripts/collect_tortoise_literature_epmc.py --output epmc-literature-leads.jsonl --report epmc-literature-report.json --workers 12 --page-size 100
      - name: Upload real unmatched literature candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: tortoise-literature-review-only
          path: |
            epmc-literature-leads.jsonl
            epmc-literature-report.json
          if-no-files-found: error
          retention-days: 90
