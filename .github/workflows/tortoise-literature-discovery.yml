name: Tortoise literature discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tortoise-literature-discovery.yml'
      - 'scripts/collect_tortoise_literature_epmc.py'
      - 'scripts/collect_tortoise_open_fulltext.py'
      - 'scripts/link_plant_abstract_mentions.py'
      - 'scripts/prepare_fulltext_plant_matching.py'
      - 'scripts/report_research_taxonomy_coverage.py'
      - 'scripts/export_candidate_taxonomy_for_research.py'
      - 'tests/test_candidate_taxonomy_research.py'
      - 'data/taxonomy-shards/**'
      - 'data/plants.json'
      - 'data/taxonomy-shards/**'
  pull_request:
    paths:
      - 'scripts/collect_tortoise_literature_epmc.py'
      - 'tests/test_tortoise_literature_epmc.py'
      - 'scripts/triage_tortoise_abstracts.py'
      - 'tests/test_tortoise_abstract_triage.py'
      - 'scripts/export_tortoise_literature_review_csv.py'
      - 'tests/test_tortoise_review_csv.py'
      - 'scripts/import_reviewed_tortoise_literature.py'
      - 'tests/test_reviewed_literature_import.py'
      - 'scripts/link_plant_abstract_mentions.py'
      - 'scripts/export_site_plant_binomials.py'
      - 'scripts/audit_catalog_identity_collisions.py'
      - 'tests/test_catalog_identity_collisions.py'
      - 'scripts/collect_tortoise_open_fulltext.py'
      - 'scripts/build_research_taxonomy_index.py'
      - 'scripts/run_bulk_research_matching.py'
      - 'scripts/audit_research_taxonomy_provenance.py'
      - 'scripts/report_research_taxonomy_coverage.py'
      - 'tests/test_research_taxonomy_coverage.py'
      - 'tests/test_research_taxonomy_provenance.py'
      - 'tests/test_bulk_research_matching.py'
      - 'tests/test_research_taxonomy_index.py'
      - 'scripts/prepare_fulltext_plant_matching.py'
      - 'scripts/triage_fulltext_plant_mentions.py'
      - 'tests/test_triage_fulltext_plant_mentions.py'
      - 'tests/test_fulltext_plant_matching.py'
      - 'tests/test_tortoise_open_fulltext.py'
      - 'tests/test_export_site_plant_binomials.py'
      - 'data/plants.json'
      - 'tests/test_link_plant_abstract_mentions.py'
      - '.github/workflows/tortoise-literature-discovery.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

# Prevent simultaneous nightly/manual harvests from competing for API quotas.
concurrency:
  group: tortoise-literature-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run literature discovery regression tests
        run: python -m unittest discover -s tests -p 'test_tortoise_literature_epmc.py'
      - name: Test abstract screening safeguards
        run: python -m unittest discover -s tests -p 'test_tortoise_abstract_triage.py'
      - name: Test literature review CSV export
        run: python -m unittest discover -s tests -p 'test_tortoise_review_csv.py'
      - name: Test reviewed observation batch importer
        run: python -m unittest discover -s tests -p 'test_reviewed_literature_import.py'
      - name: Test exact plant name bulk matching
        run: python -m unittest discover -s tests -p 'test_link_plant_abstract_mentions.py'
      - name: Test catalog identity collision audit
        run: python -m unittest discover -s tests -p 'test_catalog_identity_collisions.py'
      - name: Validate actual published catalog identities and taxonomic export
        run: |
          python scripts/audit_catalog_identity_collisions.py data/plants.json --report ci-catalog-identity-audit.json
          python scripts/export_site_plant_binomials.py data/plants.json --output ci-site-binomial-taxonomy.csv
      - name: Test site catalog taxonomic normalization
        run: python -m unittest discover -s tests -p 'test_export_site_plant_binomials.py'
      - name: Test large research-only taxonomy index safeguards
        run: python -m unittest discover -s tests -p 'test_research_taxonomy_index.py'
      - name: Test accepted-name source provenance audit
        run: python -m unittest discover -s tests -p 'test_research_taxonomy_provenance.py'
      - name: Test research-only taxon coverage reporting
        run: python -m unittest discover -s tests -p 'test_research_taxonomy_coverage.py'
      - name: Test end-to-end bulk research-only matching
        run: python -m unittest discover -s tests -p 'test_bulk_research_matching.py'
      - name: Test open access full-text collection safeguards
        run: python -m unittest discover -s tests -p 'test_tortoise_open_fulltext.py'
      - name: Test full-text to plant matching integration
        run: python -m unittest discover -s tests -p 'test_fulltext_plant_matching.py'
      - name: Test full-text mention review triage safeguards
        run: python -m unittest discover -s tests -p 'test_triage_fulltext_plant_mentions.py'
      - name: Test 9995 candidate-taxonomy shard research exporter
        run: python -m unittest discover -s tests -p 'test_candidate_taxonomy_research.py'
      - name: Export site binomials for candidate taxonomy CI
        run: python scripts/export_site_plant_binomials.py data/plants.json --output ci-site-binomial-taxonomy.csv
      - name: Validate and export real 9995 GBIF candidate names in CI
        run: |
          python scripts/export_candidate_taxonomy_for_research.py data/taxonomy-shards/index.json --site ci-site-binomial-taxonomy.csv --output ci-research-candidate-taxonomy.csv --report ci-research-candidate-report.json
      - name: Query twelve independent tortoise diet research searches in parallel
        if: github.event_name != 'pull_request'
        run: python scripts/collect_tortoise_literature_epmc.py --output epmc-literature-leads.jsonl --report epmc-literature-report.json --workers 12 --page-size 100 --max-pages 6
      - name: Fetch open-access PMC full texts concurrently
        if: github.event_name != 'pull_request'
        run: python scripts/collect_tortoise_open_fulltext.py epmc-literature-leads.jsonl --output epmc-open-fulltexts-review.jsonl --report epmc-open-fulltexts-report.json --workers 12
      - name: Screen every retrieved abstract in one batch
        if: github.event_name != 'pull_request'
        run: python scripts/triage_tortoise_abstracts.py epmc-literature-leads.jsonl --output epmc-abstract-screening.jsonl --report epmc-abstract-screening-report.json
      - name: Export prioritized review CSV for all literature candidates
        if: github.event_name != 'pull_request'
        run: python scripts/export_tortoise_literature_review_csv.py epmc-abstract-screening.jsonl --output epmc-literature-review.csv
      - name: Audit real published catalog identity collisions
        if: github.event_name != 'pull_request'
        run: python scripts/audit_catalog_identity_collisions.py data/plants.json --report site-catalog-identity-audit.json
      - name: Export real published plant catalog names
        if: github.event_name != 'pull_request'
        run: python scripts/export_site_plant_binomials.py data/plants.json --output site-plant-binomial-taxonomy.csv
      - name: Combine 9995 real taxonomy candidates with published site taxa for research only
        if: github.event_name != 'pull_request'
        run: python scripts/export_candidate_taxonomy_for_research.py data/taxonomy-shards/index.json --site site-plant-binomial-taxonomy.csv --output research-candidate-taxonomy.csv --report research-candidate-taxonomy-report.json
      - name: Batch link real site plant taxa to all discovered abstracts
        if: github.event_name != 'pull_request'
        run: python scripts/link_plant_abstract_mentions.py epmc-literature-leads.jsonl --taxonomy research-candidate-taxonomy.csv --output site-plant-literature-mentions.jsonl --report site-plant-literature-mentions-report.json
      - name: Prepare retrieved full texts for exact botanical matching
        if: github.event_name != 'pull_request'
        run: python scripts/prepare_fulltext_plant_matching.py epmc-open-fulltexts-review.jsonl --output epmc-fulltext-match-input.jsonl
      - name: Match catalog taxa against actual retrieved full texts
        if: github.event_name != 'pull_request'
        run: python scripts/link_plant_abstract_mentions.py epmc-fulltext-match-input.jsonl --taxonomy research-candidate-taxonomy.csv --source-scope fulltext --output site-plant-fulltext-mentions.jsonl --report site-plant-fulltext-mentions-report.json
      - name: Report whole-site plant research mention coverage
        if: github.event_name != 'pull_request'
        run: python scripts/report_research_taxonomy_coverage.py --taxonomy research-candidate-taxonomy.csv --abstracts site-plant-literature-mentions.jsonl --fulltexts site-plant-fulltext-mentions.jsonl --output site-plant-coverage.csv --report site-plant-coverage-report.json
      - name: Prioritize full-text plant candidates for human review
        if: github.event_name != 'pull_request'
        run: python scripts/triage_fulltext_plant_mentions.py site-plant-fulltext-mentions.jsonl --output site-plant-fulltext-review-priority.jsonl --report site-plant-fulltext-review-priority-report.json
      - name: Upload real unmatched literature candidates for review
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tortoise-literature-review-only
          path: |
            epmc-literature-leads.jsonl
            epmc-open-fulltexts-review.jsonl
            epmc-open-fulltexts-report.json
            epmc-fulltext-match-input.jsonl
            site-plant-fulltext-mentions.jsonl
            site-plant-fulltext-mentions-report.json
            site-plant-coverage.csv
            site-plant-coverage-report.json
            site-plant-fulltext-review-priority.jsonl
            site-plant-fulltext-review-priority-report.json
            epmc-literature-report.json
            epmc-abstract-screening.jsonl
            epmc-abstract-screening-report.json
            epmc-literature-review.csv
            site-catalog-identity-audit.json
            site-plant-binomial-taxonomy.csv
            research-candidate-taxonomy.csv
            research-candidate-taxonomy-report.json
            site-plant-literature-mentions.jsonl
            site-plant-literature-mentions-report.json
          if-no-files-found: warn
          retention-days: 90
