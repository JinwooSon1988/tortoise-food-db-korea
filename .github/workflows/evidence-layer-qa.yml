name: Evidence Layer QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  evidence-layer-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/qa_public_evidence_layer.py
      - run: python scripts/qa_assessment_evidence_graph.py
      - run: python scripts/qa_animal_taxa_v1.py
      - run: python scripts/qa_animal_selector_ui_v2.py
