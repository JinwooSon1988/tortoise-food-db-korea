name: Evidence data integrity
on:
  push:
    paths:
      - "data/plants.json"
      - "data/verified_plant_images_v56.json"
      - "data/nutrition_hold_list_v1.json"
      - "data/nutrition_coverage_audit_v1.json"
      - "data/plant_nutrition_v56.json"
      - "scripts/audit_nutrition_consistency.py"
      - "data/plant_nutrition_reference_v1.json"
      - "scripts/audit_nutrition_references.py"
      - "scripts/audit_evidence_coverage.py"
      - "scripts/qa_verified_plant_images.py"
      - "scripts/plant_taxon_scope.py"
      - ".github/workflows/evidence-integrity.yml"
  pull_request:
    paths:
      - "data/plants.json"
      - "data/verified_plant_images_v56.json"
      - "data/nutrition_hold_list_v1.json"
      - "data/nutrition_coverage_audit_v1.json"
      - "data/plant_nutrition_v56.json"
      - "scripts/audit_nutrition_consistency.py"
      - "data/plant_nutrition_reference_v1.json"
      - "scripts/audit_nutrition_references.py"
      - "scripts/audit_evidence_coverage.py"
      - ".github/workflows/evidence-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check plant, image and nutrition registry integrity
        run: python scripts/audit_evidence_coverage.py
      - name: Check image provenance and taxon-scope rules
        run: python scripts/qa_verified_plant_images.py
      - name: Check nutrient coverage and mineral calculations
        run: python scripts/audit_nutrition_consistency.py
      - name: Check reference-only nutrition integrity
        run: python scripts/audit_nutrition_references.py
