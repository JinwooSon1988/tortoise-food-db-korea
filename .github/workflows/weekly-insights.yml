name: Weekly insights QA
on:
  pull_request:
    paths:
      - 'weekly/**'
      - 'data/assessments.json'
      - 'data/plants.json'
      - 'scripts/audit_weekly_insights.py'
      - '.github/workflows/weekly-insights.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/audit_weekly_insights.py
