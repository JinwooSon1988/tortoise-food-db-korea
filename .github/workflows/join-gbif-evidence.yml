name: Join GBIF candidates with evidence
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download already collected GBIF candidates
        uses: actions/download-artifact@v4
        with:
          pattern: gbif-global-taxonomy-candidates-*
          path: research/generated/gbif_batches
          merge-multiple: false
          run-id: 38837601795
          github-token: ${{ github.token }}
      - name: Verify at least one archived batch was downloaded
        run: |
          find research/generated/gbif_batches -name gbif_global_taxa_sample.json -print
          test $(find research/generated/gbif_batches -name gbif_global_taxa_sample.json | wc -l) -ge 1
      - name: Link candidate taxa with existing evidence leads
        run: |
          python scripts/join_gbif_candidates_with_evidence.py \
            --batches research/generated/gbif_batches/gbif-global-taxonomy-candidates-*/gbif_global_taxa_sample.json \
            --out research/generated/gbif_candidate_evidence_join.json
      - name: Publish candidate-to-evidence mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbif-candidate-evidence-join
          path: research/generated/gbif_candidate_evidence_join.json
          retention-days: 30
