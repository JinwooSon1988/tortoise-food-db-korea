name: Bulk plant intake contract QA
on:
  pull_request:
    paths:
      - 'scripts/validate_bulk_plant_intake.py'
      - 'scripts/import_gbif_global_taxa.py'
      - 'scripts/test_import_gbif_global_taxa.py'
      - 'scripts/audit_publication_readiness.py'
      - 'scripts/test_audit_publication_readiness.py'
      - 'scripts/audit_evidence_linkage_provenance.py'
      - 'research/intake_batches/**'
      - '.github/workflows/bulk-plant-intake-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all research intake batches
        run: |
          python -m py_compile scripts/validate_bulk_plant_intake.py scripts/import_gbif_global_taxa.py
          python scripts/test_import_gbif_global_taxa.py
          python scripts/test_audit_publication_readiness.py
          python scripts/audit_evidence_linkage_provenance.py
          python - <<'PY'
          import glob, subprocess, sys
          batches = sorted(glob.glob("research/intake_batches/*.json"))
          for batch in batches:
              subprocess.run([sys.executable, "scripts/validate_bulk_plant_intake.py", batch], check=True)
          print(f"PASS: {len(batches)} research batches validated")
          PY
