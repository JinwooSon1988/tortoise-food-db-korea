name: USDA nutrition batch 1 QA
on:
  pull_request:
    paths:
      - 'data/plant_nutrition_v56.json'
      - 'data/nutrition_coverage_queue_v1.json'
      - 'scripts/qa_usda_nutrition_batch1_v1.py'
      - '.github/workflows/usda-nutrition-batch1-qa.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python scripts/qa_usda_nutrition_batch1_v1.py
