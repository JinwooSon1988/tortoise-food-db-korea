name: Global plant corpus QA
on:
  pull_request:
    paths:
      - "data/global_plant_corpus.json"
      - "data/global_plant_corpus.schema.json"
      - "scripts/qa_global_plant_corpus.py"\n      - "scripts/qa_global_plant_staging.py"\n      - "scripts/stage_global_plant_candidates.py"
      - "scripts/reconcile_curated_plants_wcvp.py"
      - "scripts/qa_curated_wcvp_reconciliation.py"
      - "data/reconciliation/**"
      - "scripts/build_curated_identity_graph.py"
      - "scripts/qa_curated_identity_graph.py"\n      - "data/staging/**"\n      - "scripts/qa_global_plant_staging.py"\n      - "scripts/stage_global_plant_candidates.py"\n      - "data/staging/**"
      - ".github/workflows/global-plant-corpus-qa.yml"
  push:
    paths:
      - "data/global_plant_corpus.json"
      - "data/global_plant_corpus.schema.json"
      - "scripts/qa_global_plant_corpus.py"
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/qa_global_plant_corpus.py\n      - run: python scripts/qa_global_plant_staging.py
      - run: python scripts/qa_curated_wcvp_reconciliation.py
      - run: python scripts/build_curated_identity_graph.py
      - run: python scripts/qa_curated_identity_graph.py
      - run: git diff --exit-code -- data/reconciliation/curated_identity_graph.json
