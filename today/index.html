<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘 뭐 먹일까? | 거북밥 DB Korea</title><meta name="description" content="현재 거북의 종별 공개 근거와 최근 7일 급여 기록을 바탕으로 오늘 검토할 먹이 후보를 정리한다."><style>:root{--bg:#f5f8f4;--card:#fff;--line:#dce5dd;--text:#17231b;--muted:#657067;--accent:#2f6b49;--soft:#eaf4ed;--warn:#fff7df}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;max-width:860px;margin:auto;padding:20px;line-height:1.58;background:var(--bg);color:var(--text)}a{color:inherit}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0}.warn{background:var(--warn);border-color:#ead28b}.small{font-size:13px;color:var(--muted)}.candidate{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}.candidate input{width:22px;height:22px;margin-top:3px}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px;margin:2px 4px 2px 0}.green{background:#e8f5eb}.yellow{background:#fff5d8}.muted{background:#f1f3f2}.actions{position:sticky;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:0 5px 18px #0001}.btn,button{border:0;border-radius:12px;padding:12px 16px;min-height:46px;font-weight:800;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft);color:#234f35}h1{margin-bottom:8px}@media(max-width:560px){body{padding:14px}.actions .btn{width:100%;margin-top:6px}}</style><link rel="manifest" href="../manifest.webmanifest"></head><body><p><a href="../index.html">← 거북밥 DB</a> · <a href="../weekly/">7일 기록</a> · <a href="../profile/">내 거북</a></p><h1>오늘 뭐 먹일까?</h1><p class="small">‘추천 점수’가 아니라 현재 공개 근거가 있는 후보를 최근 기록과 함께 정리한다.</p><div id="profile" class="card"></div><div class="card warn"><b>판정 원칙</b><br>종별 근거 단계가 높은 항목을 먼저 보여주고, 같은 단계에서는 최근 7일에 덜 반복된 항목을 앞에 둔다. 이것은 영양적 완전성·질병예방·정확한 급여량을 판정하는 기능이 아니다.</div><div id="scope" class="card"></div><div id="candidates"></div><div class="actions"><div id="picked" class="small">선택 0종</div><a id="send" class="btn primary" href="../meal/" aria-disabled="true">선택한 식물을 오늘 식단에 담기</a> <a class="btn secondary" href="../weekly/">최근 7일 확인</a></div><script src="../profile-context.js"></script><script>
const WEEKLY='tfd_weekly_v1';let plants=[],assessments=[],names={},selected=new Set();
const SPEC_SCOPE={ibera:'Mediterranean_Testudo',greek:'Mediterranean_Testudo',hermanni:'Mediterranean_Testudo',marginata:'Mediterranean_Testudo',sulcata:'Sulcata'};
const ALLOWED=new Set(['supported_mixed_diet','limited_mixed_diet','limited_supplement','supplement_general_evidence','general_reptile_supplement']);
const RANK={supported_mixed_diet:50,limited_mixed_diet:40,limited_supplement:30,supplement_general_evidence:20,general_reptile_supplement:10};
const LABEL={supported_mixed_diet:'혼합급여 지지근거',limited_mixed_diet:'제한적 혼합급여 근거',limited_supplement:'제한적 보조식 근거',supplement_general_evidence:'육지거북 일반 보조근거',general_reptile_supplement:'초식 파충류 일반근거'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localISO(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function cutoff(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6);return localISO(d)}
function weekly(){try{const a=JSON.parse(localStorage.getItem(WEEKLY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function active(){return window.TFDProfiles?.active?.()||null}
function currentRows(p){const group=SPEC_SCOPE[p.species];let rows;if(group){rows=assessments.filter(a=>a.species_group===group&&ALLOWED.has(a.verdict))}else{rows=assessments.filter(a=>['Tortoise_general','Herbivorous_reptile_general'].includes(a.species_group)&&ALLOWED.has(a.verdict))}const seen=new Set();return rows.filter(a=>{if(seen.has(a.plant_id))return false;seen.add(a.plant_id);return true})}
function recentCounts(p){const c={},last={};for(const x of weekly().filter(x=>x.profile_id===p.id&&x.date>=cutoff())){c[x.food]=(c[x.food]||0)+1;if(!last[x.food]||x.date>last[x.food])last[x.food]=x.date}return{c,last}}
function tone(v){return v==='supported_mixed_diet'?'green':ALLOWED.has(v)?'yellow':'muted'}
function updateSend(){const ids=[...selected];picked.textContent='선택 '+ids.length+'종';send.href=ids.length?'../meal/?add='+encodeURIComponent(ids.join(',')):'../meal/';send.setAttribute('aria-disabled',ids.length?'false':'true')}
function render(){const p=active();if(!p){profile.innerHTML='<b>현재 거북이 선택되지 않았다.</b><br><a href="../profile/">먼저 프로필을 등록·선택</a>하면 종별 근거와 최근 기록을 연결한다.';scope.innerHTML='프로필이 없으므로 후보를 만들지 않는다.';candidates.innerHTML='';return}profile.innerHTML='<b>현재 거북:</b> '+esc(p.name||'현재 거북')+' · '+esc(p.species_name||p.species)+(p.stage?' · '+esc(p.stage):'');const group=SPEC_SCOPE[p.species];scope.innerHTML=group?'<b>이번 후보의 주 근거 범위:</b> '+esc(group)+'<br><span class="small">개별 상세페이지의 적용범위와 한계를 우선한다.</span>':'<b>종특이 후보 제한</b><br><span class="small">현재 DB에는 이 종에 직접 적용할 충분한 species-group 판정이 없어 육지거북/초식파충류 일반근거만 보여준다. Mediterranean Testudo 판정을 자동 상속하지 않는다.</span>';const rc=recentCounts(p),today=localISO();let rows=currentRows(p).map(a=>({a,count:rc.c[a.plant_id]||0,last:rc.last[a.plant_id]||'',score:(RANK[a.verdict]||0)-(rc.c[a.plant_id]||0)*7-(rc.last[a.plant_id]===today?8:0)}));rows.sort((x,y)=>y.score-x.score||x.count-y.count||String(names[x.a.plant_id]||x.a.plant_id).localeCompare(String(names[y.a.plant_id]||y.a.plant_id)));rows=rows.slice(0,8);candidates.innerHTML=rows.length?'<h2>오늘 검토 후보</h2>'+rows.map(({a,count,last})=>{const nm=names[a.plant_id]||a.plant_id,conf=a.confidence?' · 신뢰도 '+a.confidence:'';return '<label class="card candidate"><input type="checkbox" data-id="'+esc(a.plant_id)+'"><div><b>'+esc(nm)+'</b><br><span class="tag '+tone(a.verdict)+'">🟡 '+esc(LABEL[a.verdict]||a.verdict)+esc(conf)+'</span><span class="tag">최근 7일 '+count+'회</span>'+(last?'<span class="tag">마지막 '+esc(last)+'</span>':'<span class="tag">최근 7일 기록 없음</span>')+'<div class="small">'+esc(a.role||'식단 내 역할 검토')+'</div><a href="../plant/'+encodeURIComponent(a.plant_id)+'/">근거·주의사항 상세보기</a></div></label>'}).join(''):'<div class="card">현재 공개된 근거 범위에서 후보를 만들 수 없다.</div>';document.querySelectorAll('[data-id]').forEach(x=>x.onchange=()=>{x.checked?selected.add(x.dataset.id):selected.delete(x.dataset.id);updateSend()});updateSend()}
Promise.all([fetch('../data/plants.json').then(r=>r.json()),fetch('../data/assessments.json').then(r=>r.json())]).then(([p,a])=>{plants=p;assessments=Array.isArray(a)?a:[];for(const x of plants)names[x.id]=x.ko||x.id;render()}).catch(()=>{candidates.innerHTML='<div class="card">데이터를 불러오지 못했다.</div>'});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));
</script></body></html>
