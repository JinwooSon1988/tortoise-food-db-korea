<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘 바로 뭐 먹일까? | 거북밥 DB Korea</title><meta name="description" content="현재 거북 프로필과 최근 7일 기록을 바탕으로 오늘 우선 검토할 식물 3개를 즉시 보여준다."><style>:root{--bg:#f5f8f4;--card:#fff;--line:#dce5dd;--text:#17231b;--muted:#657067;--accent:#2f6b49;--soft:#eaf4ed;--warn:#fff7df}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;max-width:760px;margin:auto;padding:18px;line-height:1.55;background:var(--bg);color:var(--text)}a{color:inherit}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.hero{border:2px solid #bfd8c6;background:#fbfefb}.warn{background:var(--warn);border-color:#ead28b}.small{font-size:13px;color:var(--muted)}.top3{display:grid;gap:10px}.item{border-top:1px solid var(--line);padding-top:10px}.item:first-child{border-top:0;padding-top:0}.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;margin-right:6px}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px;margin:3px 4px 0 0}.green{background:#e8f5eb}.yellow{background:#fff5d8}.btn{border-radius:12px;padding:12px 14px;min-height:44px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff}.btn.secondary{background:var(--soft);color:#234f35}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1}.toggle{display:flex;gap:8px;align-items:flex-start}.toggle input{width:20px;height:20px;margin-top:2px}@media(max-width:560px){body{padding:14px}.actions{display:block}.actions .btn{width:100%;margin:4px 0}}</style><link rel="manifest" href="../manifest.webmanifest"></head><body><p><a href="../index.html">← 거북밥 DB</a> · <a href="./">상세 Today</a> · <a href="../weekly/">7일 기록</a></p><h1>오늘 바로 뭐 먹일까?</h1><p class="small">추천 점수를 새로 만들지 않는다. 기존 공개 판정과 최근 7일 반복도를 이용해 먼저 볼 후보 3개만 압축한다.</p><div id="profile" class="card"></div><div class="card"><label class="toggle"><input id="pantryOnly" type="checkbox"><span><b>집에 있는 식재료만 보기</b><br><span class="small">기존 Today 화면에 저장된 보유 식재료 안에서만 다시 계산한다.</span></span></label></div><div id="answer" class="card hero"><b>후보 계산 중…</b></div><div class="card warn"><b>중요</b><br><span class="small">이 화면은 급여량·배합률·영양완전성·건강효과를 계산하지 않는다. 야생 섭식 빈도도 사육환경 급여비율로 환산하지 않는다. 상세 근거와 제한사항은 기존 Today/식물 상세 화면에서 확인한다.</span></div><div class="actions"><a id="send" class="btn" href="../meal/">상위 후보를 식단 화면에서 검토</a><a class="btn secondary" href="./">근거까지 자세히 보기</a></div><script src="../profile-context.js"></script><script>const WEEKLY='tfd_weekly_v1',PANTRY='tfd_pantry_v1';const SPEC_SCOPE={ibera:'Mediterranean_Testudo',greek:'Mediterranean_Testudo',hermanni:'Mediterranean_Testudo',marginata:'Mediterranean_Testudo',sulcata:'Sulcata'};const ALLOWED=new Set(['supported_mixed_diet','limited_mixed_diet','limited_supplement','supplement_general_evidence','general_reptile_supplement']);const RANK={supported_mixed_diet:50,limited_mixed_diet:40,limited_supplement:30,supplement_general_evidence:20,general_reptile_supplement:10};const LABEL={supported_mixed_diet:'혼합급여 지지근거',limited_mixed_diet:'제한적 혼합급여 근거',limited_supplement:'제한적 보조식 근거',supplement_general_evidence:'육지거북 일반 보조근거',general_reptile_supplement:'초식 파충류 일반근거'};let plants=[],assessments=[],names={},meta={};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function localISO(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function cutoff(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6);return localISO(d)}function read(k){try{const a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}function active(){return window.TFDProfiles?.active?.()||null}function pantryFor(p){return new Set(read(PANTRY).filter(x=>x.profile_id===p.id).map(x=>x.plant_id))}function recent(p){const c={},last={};for(const x of read(WEEKLY).filter(x=>x.profile_id===p.id&&x.date>=cutoff())){c[x.food]=(c[x.food]||0)+1;if(!last[x.food]||x.date>last[x.food])last[x.food]=x.date}return{c,last}}function rowsFor(p){const g=SPEC_SCOPE[p.species];let rows=g?assessments.filter(a=>a.species_group===g&&ALLOWED.has(a.verdict)):assessments.filter(a=>['Tortoise_general','Herbivorous_reptile_general'].includes(a.species_group)&&ALLOWED.has(a.verdict));const seen=new Set();rows=rows.filter(a=>!seen.has(a.plant_id)&&(seen.add(a.plant_id),true));if(pantryOnly.checked){const have=pantryFor(p);rows=rows.filter(a=>have.has(a.plant_id))}const rc=recent(p),today=localISO();return rows.map(a=>({a,count:rc.c[a.plant_id]||0,today:rc.last[a.plant_id]===today,rank:RANK[a.verdict]||0})).sort((x,y)=>y.rank-x.rank||x.count-y.count||Number(x.today)-Number(y.today)||String(names[x.a.plant_id]).localeCompare(String(names[y.a.plant_id])))}function render(){const p=active();if(!p){profile.innerHTML='<b>현재 거북이 선택되지 않았다.</b><br><a href="../profile/">프로필을 먼저 선택</a>한다.';answer.innerHTML='<b>후보를 만들 수 없다.</b><div class="small">프로필이 필요하다.</div>';send.href='../profile/';send.textContent='프로필 선택하기';return}profile.innerHTML='<b>'+esc(p.name||'현재 거북')+'</b> · '+esc(p.species_name||p.species)+(p.stage?' · '+esc(p.stage):'');const rows=rowsFor(p).slice(0,3);if(!rows.length){answer.innerHTML='<b>현재 조건에서 공개 근거가 있는 후보가 없다.</b><div class="small">보유 식재료 필터를 해제하거나 상세 Today 화면에서 범위를 확인한다.</div>';send.href='./';send.textContent='상세 Today에서 확인';return}answer.innerHTML='<div class="small">오늘 먼저 볼 3개</div><div class="top3">'+rows.map((r,i)=>'<div class="item"><b><span class="rank">'+(i+1)+'</span>'+esc(names[r.a.plant_id]||r.a.plant_id)+'</b><div><span class="tag '+(r.a.verdict==='supported_mixed_diet'?'green':'yellow')+'">'+esc(LABEL[r.a.verdict]||r.a.verdict)+'</span><span class="tag">최근 7일 '+r.count+'회</span>'+(meta[r.a.plant_id]?.family?'<span class="tag">'+esc(meta[r.a.plant_id].family)+'</span>':'')+'</div><div class="small">'+esc(r.a.role||'식단 내 역할 검토')+'</div></div>').join('')+'</div><p class="small">정렬 원칙: 공개 근거 단계 → 최근 7일 반복이 적은 순서 → 오늘 이미 기록된 항목 후순위.</p>';send.href='../meal/?add='+encodeURIComponent(rows.map(r=>r.a.plant_id).join(','));send.textContent='이 3개를 식단 화면에서 검토'}Promise.all([fetch('../data/plants.json').then(r=>r.json()),fetch('../data/assessments.json').then(r=>r.json())]).then(([p,a])=>{plants=p.filter(x=>x.id);assessments=Array.isArray(a)?a:[];for(const x of plants){names[x.id]=x.ko||x.id;meta[x.id]=x}pantryOnly.onchange=render;render()}).catch(()=>{answer.innerHTML='<b>데이터를 불러오지 못했다.</b>'});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));</script></body></html>
