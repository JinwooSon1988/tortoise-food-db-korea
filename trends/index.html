<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장기 추세 | 거북밥 DB Korea</title><meta name="description" content="육지거북의 체중·SCL 성장 측정과 식단 기록을 90일 또는 전체기간 시간축에서 함께 본다."><style>body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;max-width:900px;margin:auto;padding:20px;line-height:1.55;color:#17231b;background:#f7f9f6}a{color:inherit}.card{background:#fff;border:1px solid #dce4dc;border-radius:14px;padding:14px;margin:12px 0}.warn{padding:12px;background:#fff7df;border:1px solid #ecd48f;border-radius:12px}.small{font-size:13px;color:#647067}.tabs{display:flex;gap:8px}.tabs button{padding:10px 14px;border:1px solid #cbd7cc;border-radius:10px;background:#fff;font-weight:700}.tabs button.on{background:#2f6b49;color:#fff}.chart{overflow-x:auto}.chart svg{width:100%;min-width:620px;height:260px}.axis{stroke:#b8c4ba;stroke-width:1}.line{fill:none;stroke:#2f6b49;stroke-width:3}.line2{fill:none;stroke:#596a9a;stroke-width:3}.dot{fill:#2f6b49}.dot2{fill:#596a9a}.foodrow{display:grid;grid-template-columns:100px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #e6ebe6}.foodtags{display:flex;gap:5px;flex-wrap:wrap}.tag{background:#eef4ef;border-radius:999px;padding:3px 8px;font-size:12px}@media(max-width:620px){body{padding:14px}.foodrow{grid-template-columns:82px 1fr}}</style><link rel="manifest" href="../manifest.webmanifest"></head><body><p><a href="../index.html">← 거북밥 DB</a> · <a href="../growth/">성장 기록</a> · <a href="../monthly/">30일 보기</a></p><h1>장기 추세</h1><div id="profile" class="card"></div><div class="tabs"><button id="d90" class="on">최근 90일</button><button id="all">전체기간</button></div><p class="warn">그래프는 사용자가 입력한 관찰값을 시간축에 표시한다. 식단 변화와 성장 변화가 같은 시기에 보이더라도 원인·효과를 의미하지 않으며 건강·영양 적정성을 자동 판정하지 않는다.</p><div id="growth"></div><div id="foods"></div><script src="../profile-context.js"></script><script>
const W='tfd_weekly_v1',G='tfd_growth_v1';let mode='90',names={};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function load(k){try{let a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}function active(){return window.TFDProfiles?.active?.()||null}function cut(){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-89);let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),x=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${x}`}function filtered(a,p){return a.filter(x=>x.profile_id===p.id&&(mode==='all'||x.date>=cut()))}function chart(rows,key,klass){let a=rows.filter(x=>x[key]!=null).sort((x,y)=>x.date.localeCompare(y.date));if(a.length<2)return '<p class="small">'+(key==='weight_g'?'체중':'SCL')+' 그래프를 그리려면 측정값이 2회 이상 필요하다.</p>';let vals=a.map(x=>Number(x[key])),lo=Math.min(...vals),hi=Math.max(...vals);if(hi===lo){hi+=1;lo-=1}let dates=a.map(x=>new Date(x.date+'T00:00:00').getTime()),dlo=Math.min(...dates),dhi=Math.max(...dates);if(dhi===dlo)dhi=dlo+86400000;let pts=a.map((x,i)=>{let px=45+(dates[i]-dlo)/(dhi-dlo)*530,py=215-(vals[i]-lo)/(hi-lo)*170;return [px,py,x.date,vals[i]]});return '<div class="chart"><svg viewBox="0 0 620 250" role="img" aria-label="'+(key==='weight_g'?'체중':'SCL')+' 기록 그래프"><line class="axis" x1="45" y1="215" x2="575" y2="215"/><line class="axis" x1="45" y1="45" x2="45" y2="215"/><polyline class="'+klass+'" points="'+pts.map(p=>p[0]+','+p[1]).join(' ')+'"/>'+pts.map(p=>'<circle class="'+(klass==='line'?'dot':'dot2')+'" cx="'+p[0]+'" cy="'+p[1]+'" r="4"><title>'+esc(p[2])+' · '+p[3]+'</title></circle>').join('')+'<text x="45" y="238" font-size="11">'+esc(a[0].date)+'</text><text x="575" y="238" font-size="11" text-anchor="end">'+esc(a[a.length-1].date)+'</text><text x="50" y="58" font-size="11">'+hi.toFixed(1)+'</text><text x="50" y="210" font-size="11">'+lo.toFixed(1)+'</text></svg></div>'}function render(){let p=active(),pe=document.getElementById('profile');if(!p){pe.innerHTML='<b>현재 거북이 선택되지 않았다.</b><br><a href="../profile/">프로필을 등록·선택해 달라.</a>';growth.innerHTML='';foods.innerHTML='';return}pe.innerHTML='<b>현재 거북:</b> '+esc(p.name||'현재 거북')+' · '+esc(p.species_name||p.species||'')+'<br><span class="small">범위: '+(mode==='90'?'최근 90일':'전체 기록')+'</span>';let g=filtered(load(G),p),w=filtered(load(W),p);document.getElementById('growth').innerHTML='<div class="card"><h2>성장 측정 시간축</h2><h3>체중 (g)</h3>'+chart(g,'weight_g','line')+'<h3>SCL (mm)</h3>'+chart(g,'scl_mm','line2')+'</div>';let by={};w.sort((a,b)=>b.date.localeCompare(a.date)).forEach(x=>(by[x.date]??=[]).push(x.food));let dates=Object.keys(by).sort().reverse();document.getElementById('foods').innerHTML='<div class="card"><h2>같은 기간의 식단 기록</h2>'+(dates.length?dates.map(d=>'<div class="foodrow"><b>'+esc(d)+'</b><div class="foodtags">'+[...new Set(by[d])].map(f=>'<span class="tag">'+esc(names[f]||f)+'</span>').join('')+'</div></div>').join(''):'이 기간에 식단 기록이 없다.')+'<p class="small">식물 종류와 날짜를 나란히 보는 용도다. 급여량이나 영양충족도를 계산하지 않는다.</p></div>'}document.getElementById('d90').onclick=()=>{mode='90';d90.classList.add('on');all.classList.remove('on');render()};document.getElementById('all').onclick=()=>{mode='all';all.classList.add('on');d90.classList.remove('on');render()};fetch('../data/plants.json').then(r=>r.json()).then(a=>{a.forEach(x=>names[x.id]=x.ko||x.id);render()}).catch(render);if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));</script></body></html>
