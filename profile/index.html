<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 거북들 | 거북밥 DB Korea</title>
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:20px;line-height:1.6}label{display:block;margin:10px 0}input,select,button{font-size:16px;padding:9px;margin:3px}.card{border:1px solid #ccc;border-radius:12px;padding:12px;margin:12px 0}.active{outline:3px solid #555}.warn{background:#f5f5f5;padding:12px;border-left:4px solid #777}button,a,select,input{touch-action:manipulation}button{min-height:44px}input,select{max-width:100%;box-sizing:border-box}@media(max-width:520px){body{padding:14px}.card{overflow-wrap:anywhere}}</style><link rel="manifest" href="../manifest.webmanifest"></head><body>
<p><a href="../index.html">← 거북밥 DB</a> · <a href="../weekly/">7일 식단</a></p><h1>내 거북들</h1>
<p class="warn">여러 마리를 등록할 수 있다. 식단 기록과 판정 화면에서는 ‘현재 선택된 거북’의 종 정보를 사용한다. 모든 데이터는 이 브라우저에만 저장한다.</p>
<h2>거북 추가</h2><label>이름 <input id="name" maxlength="30"></label><label>종 <select id="species"><option value="ibera">이베라 그리스 (Testudo graeca ibera)</option><option value="greek">그리스 육지거북 (Testudo graeca)</option><option value="hermanni">헤르만 육지거북 (Testudo hermanni)</option><option value="marginata">마지나타 (Testudo marginata)</option><option value="horsfieldii">호스필드 (Testudo horsfieldii)</option><option value="sulcata">설카타 (Centrochelys sulcata)</option><option value="leopard">레오파드 (Stigmochelys pardalis)</option></select></label>
<label>성장단계 <select id="stage"><option value="hatchling">헤츨링</option><option value="juvenile">유체</option><option value="subadult">아성체</option><option value="adult">성체</option></select></label>
<label>체중(g, 선택) <input id="weight" type="number" min="1"></label><label>사육 <select id="housing"><option value="indoor">실내</option><option value="outdoor">야외 중심</option><option value="mixed">실내+야외</option></select></label>
<button id="add">추가</button><div id="list" aria-live="polite"></div>
<script>
const KEY='tfd_profiles_v46', ACTIVE='tfd_active_profile_v46', OLD='tfd_profile_v45';
const SPEC={"ibera": {"id": "ibera", "ko": "이베라 그리스", "scientific": "Testudo graeca ibera", "evidence_group": "mediterranean_testudo", "note": "Ibera-direct evidence is preferred; broader T. graeca/Testudo evidence must be labelled."}, "greek": {"id": "greek", "ko": "그리스 육지거북", "scientific": "Testudo graeca", "evidence_group": "testudo_graeca", "note": "Subspecies/locality differences may matter."}, "hermanni": {"id": "hermanni", "ko": "헤르만 육지거북", "scientific": "Testudo hermanni", "evidence_group": "mediterranean_testudo", "note": "Use T. hermanni evidence when available."}, "marginata": {"id": "marginata", "ko": "마지나타", "scientific": "Testudo marginata", "evidence_group": "mediterranean_testudo", "note": "Do not inherit T. graeca-specific evidence as direct."}, "horsfieldii": {"id": "horsfieldii", "ko": "호스필드", "scientific": "Testudo horsfieldii", "evidence_group": "horsfieldii", "note": "Do not auto-inherit Mediterranean Testudo verdicts."}, "sulcata": {"id": "sulcata", "ko": "설카타", "scientific": "Centrochelys sulcata", "evidence_group": "sulcata", "note": "Grass/hay ecology requires separate rules."}, "leopard": {"id": "leopard", "ko": "레오파드", "scientific": "Stigmochelys pardalis", "evidence_group": "leopard", "note": "Do not inherit Sulcata evidence automatically."}};
function uid(){return crypto.randomUUID?crypto.randomUUID():'p-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
(function migrate(){if(load().length)return;try{const o=JSON.parse(localStorage.getItem(OLD)||'null');if(o){o.id=o.id||uid();save([o]);localStorage.setItem(ACTIVE,o.id);}}catch(e){}})();
function render(){const a=load(),act=localStorage.getItem(ACTIVE);document.getElementById('list').innerHTML=a.length?a.map(p=>'<div class="card '+(p.id===act?'active':'')+'"><b>'+p.name+'</b> '+(p.id===act?'· 현재 선택':'')+'<br>'+SPEC[p.species].ko+' · '+p.stage+(p.weight?' · '+p.weight+'g':'')+' · '+p.housing+'<br><button data-use="'+p.id+'">이 거북 사용</button><button data-del="'+p.id+'">삭제</button></div>').join(''):'<p>등록된 거북이 없다.</p>';
 document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{localStorage.setItem(ACTIVE,b.dataset.use);render();});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let x=load().filter(p=>p.id!==b.dataset.del);save(x);if(localStorage.getItem(ACTIVE)===b.dataset.del)localStorage.setItem(ACTIVE,x[0]?.id||'');render();});
}
document.getElementById('add').onclick=()=>{let a=load(),p={id:uid(),name:document.getElementById('name').value.trim()||'내 거북 '+(a.length+1),species:document.getElementById('species').value,stage:document.getElementById('stage').value,weight:Number(document.getElementById('weight').value)||null,housing:document.getElementById('housing').value};a.push(p);save(a);if(!localStorage.getItem(ACTIVE))localStorage.setItem(ACTIVE,p.id);render();};render();
</script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js'));</script></body></html>
