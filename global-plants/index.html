<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>거북밥 | 전 세계 식물 근거 목록</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#193426;background:#f5f8f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}a{color:#276b48}h1{font-size:clamp(23px,4vw,34px);margin:25px 0 8px}p{line-height:1.65}.panel{background:white;border:1px solid #dce7df;border-radius:17px;padding:20px;margin:18px 0}input{width:100%;font:inherit;padding:14px;border:1px solid #aabeb1;border-radius:12px}button{font:inherit;cursor:pointer;border:0;background:#276b48;color:white;padding:10px 15px;border-radius:9px}.muted{color:#52675a}.item{padding:15px 0;border-bottom:1px solid #e3ebe5}.item:last-child{border:0}.item h3{margin:0 0 5px;font-size:17px}.chip{font-size:12px;padding:3px 8px;background:#edf3ee;border-radius:6px}.warn{background:#fff9e9;border-left:4px solid #a6771c;padding:12px 16px;border-radius:7px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.small{font-size:13px}</style></head><body><main class="wrap"><div class="top"><a href="../">← 거북밥 홈</a><button id="lang" type="button">English</button></div><h1 id="heading">전 세계 식물 · 근거 목록</h1><p id="intro">분류학적 식물 목록과 육지거북 급여 근거를 구분합니다. 이 목록에 있다는 이유만으로 먹여도 되는 식물은 아닙니다.</p><div class="warn" id="warning">급여 판정이 없는 식물은 안전성이 확인되지 않았습니다. 기존에 검토된 먹이 판정은 홈 검색에서 확인하세요.</div><section class="panel"><div class="row"><h2 id="searchlabel">식물 학명 검색</h2><span id="count" class="muted small"></span></div><input id="q" type="search" autocomplete="off" placeholder="예: Cichorium intybus"><p id="status" class="muted small" aria-live="polite"></p><div id="results"></div><div class="row"><button id="more" hidden>더 보기</button></div></section><p class="muted small" id="foot">자료 출처: GBIF 등 각 레코드에 표시된 분류학 출처. 분류 정보와 먹이 안전성은 별개입니다.</p></main><script>
const $=id=>document.getElementById(id);let rows=[],visible=0,filtered=[],en=false;const dict={ko:{heading:"전 세계 식물 · 근거 목록",intro:"분류학적 식물 목록과 육지거북 급여 근거를 구분합니다. 이 목록에 있다는 이유만으로 먹여도 되는 식물은 아닙니다.",warning:"급여 판정이 없는 식물은 안전성이 확인되지 않았습니다. 기존에 검토된 먹이 판정은 홈 검색에서 확인하세요.",searchlabel:"식물 학명 검색",placeholder:"예: Cichorium intybus",more:"더 보기",unknown:"급여 근거 미확인",candidate:"분류학 후보",count:n=>n+"건 검색",empty:"일치하는 식물이 없습니다.",loading:"식물 목록을 불러오는 중입니다.",failed:"데이터 파일이 아직 등록되지 않았거나 읽을 수 없습니다.",foot:"분류학 출처는 개별 레코드에서 확인할 수 있습니다. 식물 분류정보는 급여 안전성을 입증하지 않습니다.",source:"분류정보 출처"},en:{heading:"Global plant evidence index",intro:"Taxonomy records are separate from tortoise feeding evidence. Listing does not imply that a plant is edible or safe.",warning:"Plants without a feeding assessment have unestablished safety. See the home search for reviewed feeding assessments.",searchlabel:"Search scientific names",placeholder:"e.g. Cichorium intybus",more:"Show more",unknown:"Feeding evidence not confirmed",candidate:"Taxonomy candidate",count:n=>n+" matches",empty:"No matching plants.",loading:"Loading plant index…",failed:"The dataset is not available yet.",foot:"Taxonomy sources are linked per record. Taxonomic identity does not establish feeding safety.",source:"Taxonomy source"}};function t(k){return dict[en?"en":"ko"][k]}function localize(){for(const k of ["heading","intro","warning","searchlabel","foot"])$(k).textContent=t(k);$("q").placeholder=t("placeholder");$("more").textContent=t("more");$("lang").textContent=en?"한국어":"English";document.documentElement.lang=en?"en":"ko";render(true)}function render(reset=false){if(reset){filtered=rows.filter(x=>(x.scientific_name||"").toLowerCase().includes($("q").value.trim().toLowerCase()));visible=0;$("results").replaceChildren()}$("count").textContent=t("count")(filtered.length);const next=filtered.slice(visible,visible+60);const frag=document.createDocumentFragment();for(const x of next){const article=document.createElement("article");article.className="item";const h=document.createElement("h3");h.textContent=x.scientific_name||"—";article.append(h);const line=document.createElement("div");line.className="row small muted";const span=document.createElement("span");span.textContent=t("candidate")+" · "+t("unknown");line.append(span);if(x.source_taxon_url&&/^https:\/\//.test(x.source_taxon_url)){const a=document.createElement("a");a.href=x.source_taxon_url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=t("source");line.append(a)}article.append(line);frag.append(article)}$("results").append(frag);visible+=next.length;$("more").hidden=visible>=filtered.length;$("status").textContent=rows.length===0?$("status").textContent:filtered.length===0?t("empty"):""}$("q").addEventListener("input",()=>render(true));$("more").addEventListener("click",()=>render());$("lang").addEventListener("click",()=>{en=!en;localize()});$("status").textContent=t("loading");fetch("../data/global_taxonomy_candidates.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{const a=Array.isArray(d)?d:d.records;if(!Array.isArray(a))throw Error("schema");rows=a.filter(x=>x&&typeof x.scientific_name==="string"&&x.scientific_name.trim()).map(x=>({scientific_name:x.scientific_name,source_taxon_url:x.source_taxon_url}));$("status").textContent="";render(true)}).catch(()=>{$("status").textContent=t("failed")});localize();
</script></body></html>
