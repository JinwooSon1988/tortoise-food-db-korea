<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30일 기록 | 거북밥 DB Korea</title><meta name="description" content="육지거북의 최근 30일 먹이와 성장 기록을 개체별로 함께 본다."><style>body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;max-width:860px;margin:auto;padding:20px;line-height:1.55;color:#17231b;background:#f7f9f6}a{color:inherit}.card{background:#fff;border:1px solid #dce4dc;border-radius:14px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#fafcf9;border:1px solid #e3e8e3;border-radius:12px;padding:12px}.big{font-size:24px;font-weight:800}.small{font-size:13px;color:#647067}.warn{padding:12px;background:#fff7df;border:1px solid #ecd48f;border-radius:12px}table{width:100%;border-collapse:collapse;background:#fff}td,th{border-bottom:1px solid #e3e8e3;padding:8px;text-align:left}.bar{height:10px;background:#e8eee9;border-radius:99px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#2f6b49}@media(max-width:620px){body{padding:14px}.grid{grid-template-columns:1fr}table{font-size:14px}}</style><link rel="manifest" href="../manifest.webmanifest"></head><body><p><a href="../index.html">← 거북밥 DB</a> · <a href="../weekly/">7일 기록</a> · <a href="../growth/">성장 기록</a></p><h1>최근 30일 기록</h1><div id="profile" class="card"></div><p class="warn">이 화면은 기록을 요약해 보여주는 도구다. 식물 종수·반복 횟수·체중 변화만으로 건강, 영양충족, 성장 적정성을 판정하지 않는다.</p><div id="summary"></div><div id="foods"></div><div id="growth"></div><script src="../profile-context.js"></script><script>
const WKEY='tfd_weekly_v1',GKEY='tfd_growth_v1';let names={};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localISO(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function cutoff(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-29);return localISO(d)}
function load(k){try{const a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function active(){return window.TFDProfiles?.active?.()||null}
function render(){const p=active(),pe=document.getElementById('profile');if(!p){pe.innerHTML='<b>현재 거북이 선택되지 않았다.</b><br><a href="../profile/">프로필을 먼저 선택해 달라.</a>';document.getElementById('summary').innerHTML='';document.getElementById('foods').innerHTML='';document.getElementById('growth').innerHTML='';return}pe.innerHTML='<b>현재 거북:</b> '+esc(p.name||'현재 거북')+' · '+esc(p.species_name||p.species||'');const cut=cutoff(),weekly=load(WKEY).filter(x=>x.profile_id===p.id&&x.date>=cut),growth=load(GKEY).filter(x=>x.profile_id===p.id&&x.date>=cut).sort((a,b)=>a.date.localeCompare(b.date));const counts={};for(const x of weekly)counts[x.food]=(counts[x.food]||0)+1;const unique=Object.keys(counts),days=new Set(weekly.map(x=>x.date)).size,repeated=Object.entries(counts).sort((a,b)=>b[1]-a[1]);let weightChange=null,sclChange=null;if(growth.length>=2){const w=growth.filter(x=>x.weight_g!=null),s=growth.filter(x=>x.scl_mm!=null);if(w.length>=2)weightChange=w[w.length-1].weight_g-w[0].weight_g;if(s.length>=2)sclChange=s[s.length-1].scl_mm-s[0].scl_mm}document.getElementById('summary').innerHTML='<div class="grid"><div class="metric"><div class="big">'+weekly.length+'</div><div>먹이 기록 횟수</div></div><div class="metric"><div class="big">'+unique.length+'</div><div>서로 다른 식물</div></div><div class="metric"><div class="big">'+days+'</div><div>기록이 있는 날짜</div></div><div class="metric"><div class="big">'+growth.length+'</div><div>성장 측정 횟수</div></div></div><div class="card"><b>측정 변화</b><br>'+(weightChange==null?'체중 비교 자료 부족':'체중 '+(weightChange>=0?'+':'')+weightChange.toFixed(1)+'g')+' · '+(sclChange==null?'SCL 비교 자료 부족':'SCL '+(sclChange>=0?'+':'')+sclChange.toFixed(1)+'mm')+'<br><span class="small">30일 안의 첫 측정과 마지막 측정의 단순 차이다.</span></div>';const max=repeated.length?repeated[0][1]:1;document.getElementById('foods').innerHTML='<div class="card"><h2>먹이 반복 분포</h2>'+(repeated.length?repeated.map(([id,n])=>'<div style="margin:10px 0"><b>'+esc(names[id]||id)+'</b> '+n+'회<div class="bar"><div class="fill" style="width:'+Math.round(n/max*100)+'%"></div></div></div>').join(''):'최근 30일 먹이 기록이 없다.')+'<p class="small">반복 분포는 편중을 살펴보기 위한 기록 요약이며 위험 판정이 아니다.</p></div>';document.getElementById('growth').innerHTML='<div class="card"><h2>성장 측정</h2>'+(growth.length?'<table><thead><tr><th>날짜</th><th>체중</th><th>SCL</th></tr></thead><tbody>'+growth.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+(x.weight_g!=null?esc(x.weight_g)+'g':'-')+'</td><td>'+(x.scl_mm!=null?esc(x.scl_mm)+'mm':'-')+'</td></tr>').join('')+'</tbody></table>':'최근 30일 성장 측정 기록이 없다.')+'</div>'}
fetch('../data/plants.json').then(r=>r.json()).then(a=>{for(const x of a)names[x.id]=x.ko||x.id;render()}).catch(render);if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));
</script></body></html>
