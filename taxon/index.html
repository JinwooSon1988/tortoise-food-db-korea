re not zero.')+'</p></section>'+
 '<section class="panel evidence-deep" id="evidence" aria-labelledby="ev-h"><div class="sectioneyebrow">'+T('근거 상세히 알아보기','Explore the evidence')+'</div><h2 id="ev-h">'+T('판정 근거','Evidence for this status')+'</h2><div class="evidence-core"><h3>'+T('근거 구성','Evidence composition')+'</h3><div class="evcountnote"><b>'+T('근거 한눈에 보기','Evidence at a glance')+'</b><div class="evstats"><div><span>'+T('연결된 출처','Linked sources')+'</span><strong>'+(r.feeding_evidence.length+feed.length)+T('건',' sources')+'</strong></div><div><span>'+T('직접 근거','Direct evidence')+'</span><strong>'+observations.length+T('건',' records')+'</strong></div><div><span>'+T('원문 확인','Original checked')+'</span><strong>'+checked+T('건',' records')+'</strong></div></div><small>'+T('출처 수는 안전성 등급이 아닙니다. 항목은 서로 중복될 수 있습니다.','Source counts do not establish safety; categories may overlap.')+'</small></div></div>'+evidenceSummary+'<details class="evidencefold"><summary>'+T('원문 근거 '+(r.feeding_evidence.length+feed.length)+'건 자세히 보기','View '+(r.feeding_evidence.length+feed.length)+' source records')+'</summary><div class="evidence-list">'+(r.feeding_evidence.length||feed.length?'<p class="evidence-count">'+T('연결된 근거 ','Linked sources ')+(r.feeding_evidence.length+feed.length)+(studies>1?T('건 (서로 다른 연구 '+studies+'건)',' (from '+studies+' separate studies)'):T('건',''))+T(' · 자료의 검증 상태와 적용 종을 확인하세요.',' · Check verification status and applicable tortoise species.')+'</p>':'<div class="evidence-empty"><b>'+T('현재 연결된 급여 연구·사육 자료가 없습니다.','No feeding research or husbandry sources are linked yet.')+'</b><p>'+T('자료가 없다는 것은 안전하다는 뜻도, 독성이 입증되었다는 뜻도 아닙니다. 식물 동정만으로 급여를 결정하지 마세요.','Lack of linked evidence does not establish safety or toxicity. Do not make feeding decisions from plant identification alone.')+'</p></div>')+'<p class="note">'+T('근거는 종류별로 나눠 표시합니다. 야생 섭식 관찰은 사육 환경의 급여 권장이 아니며, 급여량·빈도를 정하지 않습니다.','Evidence is grouped by type. A wild feeding observation is not a captive feeding recommendation and sets no amount or frequen async function boot(){
 state='loading';render();const id=idFromUrl();if(!id){state='done';render();return}
 const key=Number(id.split(':')[1]);
 // The catalog shard alone is sufficient to show the plant identity immediately.
 // Load the small, identity-specific shard first. The optional batch index must not
 // block detail pages whose feeding evidence is already embedded in the shard.
 const shard=await j('../data/plant-catalog/taxa-'+String(key%SHARDS).padStart(2,'0')+'.json');
 if(!shard||!Array.isArray(shard.records)){state='error';render();return}
 rec=shard.records.find(x=>x.id===id)||null;
 const directEvidence=rec&&Array.isArray(rec.feeding_evidence)&&rec.feeding_evidence.length>0;
 if(rec&&!directEvidence){
  batch002=await j('../data/catalog-evidence/batch-002-site-index.json');
  if(!(batch002?.by_scientific_name?.[String(rec.scientific||'').trim().toLowerCase()]||[]).length)rec=null;
 }
 if(!rec){state='done';render();return}
 state='done';render();
 // Load optional evidence independently; failure of one dataset must not hide others.
 const tasks=[
  j('../data/feeding_pending_site_v1.json').then(x=>{pending=x?.records||{};render()}),
  j('../data/plant-catalog/index.json').then(x=>{corpus=x?.research_corpus||[];render()}),
  j('../data/community_source_leads_v1.json').then(x=>{community=x?.records||[];render()}),
  j('../data/research_source_leads_index.json').then(x=>{researchLeads=x?.taxa||{};render()}),
  Promise.resolve()
 ];
 await Promise.allSettled(tasks);
}
window.addEventListener('tfdblanguagechange',render);
document.querySelector('.langswitch')?.addEventListener('click',e=>{if(e.target.closest('button[data-lang]'))queueMicrotask(render)});
boot().catch(err=>{console.error('Plant detail initialization failed:',err);state='error';render()});
})();
</script></body></html>
