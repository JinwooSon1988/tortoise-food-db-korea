 '<p>'+T('원문 표기','Name in the source')+': <i lang="la">'+esc(x.reported_name)+'</i></p>'+
 (nr?'<p class="note">'+(nr.basis==='gbif_synonym'?T('GBIF에서 이 종의 동의어로 처리되는 이름이라 이 종에 연결했습니다.','GBIF treats this name as a synonym of this species, so it is linked here.'):T('철자 변이(어미 차이)로 이 종에 연결했습니다.','Linked here as a spelling variant (ending only).'))+'</p>':'')+

 return '<section class="panel" aria-labelledby="literature-leads-h"><h2 id="literature-leads-h">'+T('추가 문헌 검색 결과','Additional literature search results')+' ('+entries.length+')</h2><p class="note">'+T('자동 검색된 후보이며 식물의 급여 안전성이나 실제 섭식 사실을 입증하지 않습니다. 제목의 키워드만으로 우선 검토 대상을 구분했으며, 원문 검증 전에는 급여 등급에 반영하지 않습니다.','Automated search hits do not establish feeding safety or actual consumption. Title keywords only prioritize review; none is used for feeding grades without source verification.')+'</p>'+
 (priority.length?'<h3>'+T('육지거북 관련 용어 또는 해당 식물명과 섭식 용어 포함','Tortoise terms or species name with feeding terms in title')+' ('+priority.length+')</h3>'+priority.map(item).join(''):'')+
 (other.length?'<details><summary>'+T('그 밖의 미검증 검색 결과','Other unverified search hits')+' ('+other.length+')</summary>'+other.map(item).join('')+'</details>':'')+'</section>';

 const r=rec,name=title(r);
 if(!Array.isArray(r.feeding_evidence))r.feeding_evidence=[];document.title=name+(name!==r.scientific?' ('+r.scientific+')':'')+T(' | 거북밥 DB',' | Geobukbap DB');
 const groups=TYPES.map(([k,ko,e])=>{const items=(Array.isArray(r.feeding_evidence)?r.feeding_evidence:[]).filter(x=>x.type===k);if(!items.length)return '';return '<div class="evtype"><h3>'+(en()?e:ko)+'</h3>'+items.map(evHTML).join('')+'</div>'}).join('');
 const feed=(pending&&pending[r.id])||[];

 const checked=ev.filter(x=>CHECKED.includes(x.verification)).length;
 const community=ev.filter(x=>COMMUNITY.includes(x.verification)).length;
 const preliminary=ev.length-checked-community;
 const pendingReview=feed.length;
 const studies=new Set(ev.map(x=>x.study||x.source)).size;
 const rs=r.research&&RS[r.research.status],cor=(corpus||[]).find(c=>!c.summary),more=(corpus||[]).filter(c=>c.summary);
 const leadCount=((researchLeads[r.id]||{}).literature_leads||[]).length;
 const research=rs?'<section class="panel" aria-labelledby="rs-h"><h2 id="rs-h">'+T('조사 현황','Research status')+'</h2><p><b>'+esc(en()?rs[1]:rs[0])+'</b></p>'+
 (leadCount?'<p class="note">'+T('추가 문헌 검색 후보 '+leadCount+'건이 연결되어 있습니다. 아직 원문에서 육지거북 섭식 근거가 확인된 것은 아니므로 기존 조사 상태 및 급여 판정은 변경되지 않습니다.','There are '+leadCount+' additional literature search hits. These have not been verified as tortoise feeding evidence, so the original research status and feeding verdict remain unchanged.')+'</p>':'')+
 (cor?'<p class="note">'+T('조사 범위: '+esc(cor.searched)+' 기준 Europe PMC·OpenAlex 오픈액세스 문헌 검색, 원문 '+((cor.full_texts_read_by_machine||{}).europe_pmc_jats_xml+(cor.full_texts_read_by_machine||{}).openalex_open_access_pdf)+'편을 기계로 선별한 뒤 거북 식성 논문은 사람이 원문을 확인.'+(more.length?'':' 유료 논문·도서·사육자 커뮤니티는 아직 포함되지 않았습니다.'),
 'Searched: open-access literature in Europe PMC and OpenAlex as of '+esc(cor.searched)+'; '+((cor.full_texts_read_by_machine||{}).europe_pmc_jats_xml+(cor.full_texts_read_by_machine||{}).openalex_open_access_pdf)+' full texts screened by machine, tortoise diet papers then read by hand.'+(more.length?'':' Paywalled papers, books and keeper communities are not covered yet.'))+'</p>':'')+
 more.map(c=>'<p class="note">'+T('추가 조사 ','Further search ')+esc(c.searched)+': '+esc(c.summary[en()?'en':'ko'])+'</p>').join('')+
 '<p class="note">'+T('자료 미확보는 조사한 범위에서 급여 기록을 찾지 못했다는 뜻일 뿐, 안전하거나 위험하다는 판정이 아닙니다. 한 거북 종의 기록을 다른 종에 그대로 적용하지 마세요.','"No data found" only means no feeding record was found in the searched sources; it is not a safety or risk verdict. Do not apply a record for one tortoise species to another.')+'</p></section>':'';
 const evidenceSummary=checked||preliminary||community?'<div class="evidence-summary"><strong>'+T('근거 검증 현황','Evidence verification')+'</strong><span>'+T('원문 확인 ','Original checked ')+checked+T('건 · 재확인 필요 ',' · Needs rechecking ')+preliminary+T('건 · 급여 기록 검토 중 ',' · Feeding records under review ')+pendingReview+T('건','')+(community?T(' · 경험담·영상 ',' · Keeper, community or video reports ')+community+T('건',''):'')+'</span><small>'+T('원문 확인은 급여 안전성 승인과 다릅니다. 검증 중인 기록은 등급 산정에 사용하지 않습니다.','Checking a source is not a feeding safety approval. Records under review do not establish a feeding grade.')+'</small></div>':'';
 view.innerHTML='<article class="hero"><div class="photo" role="img" aria-label="'+T('검증된 이미지 준비 중','Verified photo pending')+'">'+T('검증된 이미지 준비 중','Verified photo pending')+'</div><div><h1>'+esc(name)+'</h1><p class="sub"><span class="sci" lang="la">'+esc(r.scientific)+'</span>'+(r.authorship?' '+esc(r.authorship):'')+(r.family?' · '+esc(r.family):'')+'</p>'+
 '<span class="status"><b>—</b>'+T('급여 안전성 미확정','Feeding safety not established')+'</span>'+
 '<p class="lead">'+T('이 식물은 아직 육지거북 급여 안전성을 평가하지 않아 급여 등급(A~D)이 없습니다. 분류학적으로 확인된 식물이라는 사실은 먹여도 된다는 근거가 아닙니다.','This plant has not been assessed for tortoise feeding safety, so it has no feeding grade (A–D). Being a confirmed plant species is not evidence that it can be fed.')+'</p></div></article>'+
 '<section class="panel" aria-labelledby="ev-h"><h2 id="ev-h">'+T('급여 근거','Feeding evidence')+'</h2>'+evidenceSummary+(r.feeding_evidence.length||feed.length?'<p class="evidence-count">'+T('연결된 근거 ','Linked sources ')+(r.feeding_evidence.length+feed.length)+(studies>1?T('건 (서로 다른 연구 '+studies+'건)',' (from '+studies+' separate studies)'):T('건',''))+T(' · 자료의 검증 상태와 적용 종을 확인하세요.',' · Check verification status and applicable tortoise species.')+'</p>':'<div class="evidence-empty"><b>'+T('현재 연결된 급여 연구·사육 자료가 없습니다.','No feeding research or husbandry sources are linked yet.')+'</b><p>'+T('자료가 없다는 것은 안전하다는 뜻도, 독성이 입증되었다는 뜻도 아닙니다. 식물 동정만으로 급여를 결정하지 마세요.','Lack of linked evidence does not establish safety or toxicity. Do not make feeding decisions from plant identification alone.')+'</p></div>')+'<p class="note">'+T('근거는 종류별로 나눠 표시합니다. 야생 섭식 관찰은 사육 환경의 급여 권장이 아니며, 급여량·빈도를 정하지 않습니다.','Evidence is grouped by type. A wild feeding observation is not a captive feeding recommendation and sets no amount or frequency.')+'</p>'+groups+
 (feed.length?'<div class="evtype"><h3>'+T('원문 검증 급여 기록 (검증 중)','Feeding records checked in the original (under review)')+'</h3>'+feed.map(x=>{const L=en()?'en':'ko';return '<div class="ev"><p><b>'+esc(x.tortoise[L])+'</b> · '+esc(x.location[L])+' · '+esc(x.period[L])+'</p><p>'+esc(x.method_text[L])+'</p><p>'+T('먹은 부위','Plant part')+': '+(x.plant_part?esc(x.plant_part[L]):T('원문 미기재','Not reported in the original'))+'</p>'+(x.observed_share?'<p>'+esc(x.observed_share[L])+'</p>':'')+'<p class="src">'+esc(x.citation)+' · '+esc(x.locator)+(x.url&&/^https?:\/\//i.test(x.url)?' <a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+T('원문 보기 ↗','Open the original ↗')+'</a>':'')+'</p></div>'}).join('')+'</div>':'')+
 '</section>'+batch002HTML(r)+communityHTML(r)+researchLeadHTML(r)+research+
 '<section class="panel" aria-labelledby="tx-h"><h2 id="tx-h">'+T('이름과 분류','Names and taxonomy')+'</h2><dl class="kv">'+
 '<dt>'+T('학명','Scientific name')+'</dt><dd><i lang="la">'+esc(r.scientific)+'</i>'+(r.authorship?' '+esc(r.authorship):'')+'</dd>'+

 '<dt>'+T('한국어 이름','Korean names')+'</dt><dd lang="ko">'+names(r.common_names.ko)+'</dd>'+
 '<dt>'+T('과 · 목 · 속','Family · order · genus')+'</dt><dd>'+esc([r.family,r.order,r.genus].filter(Boolean).join(' · '))+'</dd>'+
 '<dt>'+T('분류 출처','Taxonomy source')+'</dt><dd>'+esc(r.taxonomy.source)+' · '+T('수용명','accepted name')+' · '+T('종','species')+' · '+T('확인일 ','checked ')+esc(r.taxonomy.checked)+' <a href="'+esc(r.taxonomy.url)+'" target="_blank" rel="noopener noreferrer">GBIF ↗</a></dd>'+
 '<dt>'+T('사진','Photo')+'</dt><dd>'+T('검증된 이미지 준비 중 (종 동정이 확인된 사진만 표시)','Verified photo pending (only photos with a confirmed species identification are shown)')+'</dd>'+
 '</dl><p class="note">'+T('분류 정보는 이 식물이 실제 종이라는 것만 확인합니다. 급여 근거와는 별개입니다.','Taxonomy only confirms that this is a real species. It is separate from feeding evidence.')+'</p></section>'+
 '<div class="links"><a href="../all-plants/'+(en()?'?lang=en':'')+'">'+T('전체 식물 목록','All plants')+'</a><a href="../index.html">'+T('먹이 검색','Search foods')+'</a></div>'}
async function boot(){
 state='loading';render();const id=idFromUrl();if(!id){state='done';render();return}
 const key=Number(id.split(':')[1]);
 // The catalog shard alone is sufficient to show the plant identity immediately.
 const [shard, batchIndex]=await Promise.all([j('../data/plant-catalog/taxa-'+String(key%SHARDS).padStart(2,'0')+'.json'),j('../data/catalog-evidence/batch-002-site-index.json')]);
 batch002=batchIndex;
 if(!shard||!Array.isArray(shard.records)){state='error';render();return}
 rec=shard.records.find(x=>x.id===id)||null;
 // Taxonomy-only entries are not published as food profiles.
 if(rec && !(Array.isArray(rec.feeding_evidence)&&rec.feeding_evidence.length) && !(batch002?.by_scientific_name?.[String(rec.scientific||'').trim().toLowerCase()]||[]).length)rec=null;
 if(!rec){state='done';render();return}
 state='done';render();
 // Load optional evidence independently; failure of one dataset must not hide others.
 const tasks=[
  j('../data/feeding_pending_site_v1.json').then(x=>{pending=x?.records||{};render()}),
  j('../data/plant-catalog/index.json').then(x=>{corpus=x?.research_corpus||[];render()}),
  j('../data/community_source_leads_v1.json').then(x=>{community=x?.records||[];render()}),
  j('../data/research_source_leads_index.json').then(x=>{researchLeads=x?.taxa||{};render()}),
  Promise.resolve()
 ];
 await Promise.allSettled(tasks);
}
window.addEventListener('tfdblanguagechange',render);
document.querySelector('.langswitch')?.addEventListener('click',e=>{if(e.target.closest('button[data-lang]'))queueMicrotask(render)});
boot().catch(err=>{console.error('Plant detail initialization failed:',err);state='error';render()});
})();
