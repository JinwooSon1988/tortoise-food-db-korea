<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="육지거북 먹이 69종의 급여 판정, 학명, 과, 근거등급과 영양자료를 검색·정렬해 비교한다."><link rel="canonical" href="https://jinwooson1988.github.io/tortoise-food-db-korea/all-plants/"><title>육지거북 먹이 69종 총정리·검색 | 거북밥 DB</title><style>:root{--bg:#f4f7f3;--card:#fff;--text:#17231b;--muted:#667168;--line:#dce5dd;--accent:#2f6b49}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--text)}.wrap{max-width:1500px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between}.top a{color:var(--accent);font-weight:800}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls select{min-height:44px;border:1px solid #cbd9ce;border-radius:10px;padding:9px 11px;font-size:14px}.controls input{min-width:230px;flex:1}.small{color:var(--muted);font-size:13px}.tablewrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:12px;background:#fff}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1450px;font-size:13px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);border-right:1px solid #edf1ed;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#eef5f0;z-index:2;cursor:pointer;user-select:none}th:hover{background:#e1eee5}tr:hover td{background:#fafcf9}.sci{font-style:italic}.name a{font-weight:900;color:#234f35}.verdict{font-weight:800}.grade{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border:1px solid var(--line);border-radius:7px;font-weight:900}.grade-a{background:#edf7ee}.grade-b{background:#fff8df}.grade-c{background:#fff1df}.grade-d{background:#f9e8e8}.grade-p{background:#f1f1f1}.num{text-align:right;font-variant-numeric:tabular-nums}.na{color:#a0a7a1}.legend{margin-top:10px}.gradelegend{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.gradelegend span{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fafcf9;font-weight:800}.gradelegend i{font-style:normal;font-weight:900}.mobilecards{display:none}.mcard{border:1px solid var(--line);border-radius:13px;background:#fff;padding:13px;margin:9px 0}.mcardtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.mcard h2{font-size:17px;margin:0}.mcard h2 a{color:#234f35}.mcard .sci{font-size:11px;color:var(--muted);margin-top:2px}.mverdict{font-size:11px;font-weight:900;border:1px solid var(--line);border-radius:999px;padding:5px 7px;white-space:nowrap}.mmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.mmeta div{border:1px solid var(--line);border-radius:9px;background:#f7faf7;padding:7px}.mmeta b{display:block;font-size:13px}.mmeta span{font-size:10px;color:var(--muted)}.sortmark{font-size:10px;margin-left:4px}@media(max-width:650px){.wrap{padding:10px}.top{align-items:flex-start}.controls{display:grid;grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1;min-width:0}.tablewrap{display:none}.mobilecards{display:block}.legend{line-height:1.55}}</style></head><body><main class="wrap"><header class="top"><div><h1>전체 식물 데이터</h1><div id="summary" class="small">불러오는 중...</div></div><a href="../">← 검색으로</a></header><section class="panel"><div class="controls"><input id="q" type="search" placeholder="한글명·영문명·학명 검색"><select id="verdict"><option value="">적합성 전체</option></select><select id="category"><option value="">종류 전체</option></select><select id="family"><option value="">과 전체</option></select><select id="nutrition"><option value="">영양자료 전체</option><option value="yes">영양자료 있음</option><option value="no">영양자료 없음</option></select></div><div class="legend small">열 제목을 누르면 오름차순 ↕ 내림차순으로 정렬한다. 영양성분은 확인된 공식 식품성분 자료가 있는 경우에만 표시하며, 수치 자체가 급여 적합성을 결정하지 않는다.</div><div class="gradelegend" aria-label="급여 등급 안내"><span><i>A</i> 혼합식 활용 가능</span><span><i>B</i> 제한적 혼합 급여</span><span><i>C</i> 가끔 보조 급여</span><span><i>D</i> 급여하지 않음</span><span><i>—</i> 판정 보류</span></div></section><div id="mobilecards" class="mobilecards"></div><div class="tablewrap"><table><thead><tr><th data-k="ko">식물명</th><th data-k="en">영문명</th><th data-k="scientific">학명</th><th data-k="family">과</th><th data-k="category">종류</th><th data-k="verdictRank">적합성</th><th data-k="confidence">근거등급</th><th data-k="water">수분 g</th><th data-k="fiber">섬유 g</th><th data-k="calcium">Ca mg</th><th data-k="phosphorus">P mg</th><th data-k="ratio">Ca:P</th><th data-k="protein">단백질 g</th><th data-k="potassium">K mg</th><th data-k="vitc">Vit C mg</th></tr></thead><tbody id="body"></tbody></table></div></main><script>const VL={supported_mixed_diet:'A (혼합식 활용 가능)',limited_mixed_diet:'B (제한적 혼합 급여)',limited_supplement:'C (가끔 보조 급여)',supplement_general_evidence:'C (가끔 보조 급여)',general_reptile_supplement:'C (가끔 보조 급여)',do_not_feed:'D (급여하지 않음)',blocked:'판정 보류',unresolved:'판정 보류'};const VR={supported_mixed_diet:1,limited_mixed_diet:2,limited_supplement:3,supplement_general_evidence:4,general_reptile_supplement:5,do_not_feed:6,blocked:7,unresolved:7};let rows=[],sortKey='ko',sortDir=1,evidenceMap=new Map;const $=id=>document.getElementById(id);async function j(u){try{let r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}function best(arr){return arr.find(x=>x.species_group==='Mediterranean_Testudo')||arr.find(x=>x.species_group==='Tortoise_general')||arr[0]||null}function n(v){return v==null?null:Number(v)}function val(v,d=2){return v==null?'<span class="na">—</span>':Number(v).toFixed(d).replace(/\.00$/,'')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fill(sel,vals,labelFn=null){const seen=new Set;[...new Set(vals.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'ko')).forEach(v=>{const label=labelFn?labelFn(v):v;if(seen.has(label))return;seen.add(label);let o=document.createElement('option');o.value=v;o.textContent=label;sel.appendChild(o)})}function filtered(){let term=$('q').value.trim().toLowerCase(),v=$('verdict').value,c=$('category').value,f=$('family').value,nu=$('nutrition').value;return rows.filter(r=>(!term||[r.ko,r.en,r.scientific].join(' ').toLowerCase().includes(term))&&(!v||r.verdict===v)&&(!c||r.category===c)&&(!f||r.family===f)&&(!nu||(nu==='yes')===r.hasNutrition))}function cmp(a,b){let x=a[sortKey],y=b[sortKey];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;if(typeof x==='number'&&typeof y==='number')return(x-y)*sortDir;return String(x).localeCompare(String(y),'ko',{numeric:true})*sortDir}function render(){let out=filtered().sort(cmp);$('summary').textContent='전체 '+rows.length+'종 중 '+out.length+'종 표시';$('mobilecards').innerHTML=out.map(r=>'<article class="mcard"><div class="mcardtop"><div><h2><a href="../plant/'+encodeURIComponent(r.id)+'/">'+esc(r.ko)+'</a></h2><div class="sci">'+esc(r.scientific)+'</div></div><span class="mverdict">'+esc(VL[r.verdict]||'판정 보류')+'</span></div><div class="mmeta"><div><b>'+esc(r.confidence||'—')+'</b><span>근거등급</span></div><div><b>'+esc(r.directEvidence)+'</b><span>직접근거</span></div><div><b>'+(r.hasNutrition?'있음':'미확인')+'</b><span>영양자료</span></div></div></article>').join('');$('body').innerHTML=out.map(r=>'<tr><td class="name"><a href="../plant/'+encodeURIComponent(r.id)+'/">'+esc(r.ko)+'</a></td><td>'+esc(r.en)+'</td><td class="sci">'+esc(r.scientific)+'</td><td>'+esc(r.family)+'</td><td>'+esc(r.category)+'</td><td class="verdict">'+esc(VL[r.verdict]||'판정 보류')+'</td><td>'+esc(r.confidence||'—')+'</td><td class="num">'+val(r.water,1)+'</td><td class="num">'+val(r.fiber,2)+'</td><td class="num">'+val(r.calcium,1)+'</td><td class="num">'+val(r.phosphorus,1)+'</td><td class="num">'+val(r.ratio,2)+'</td><td class="num">'+val(r.protein,2)+'</td><td class="num">'+val(r.potassium,1)+'</td><td class="num">'+val(r.vitc,1)+'</td></tr>').join('');document.querySelectorAll('th').forEach(th=>{th.querySelector('.sortmark')?.remove();if(th.dataset.k===sortKey){let s=document.createElement('span');s.className='sortmark';s.textContent=sortDir===1?'▲':'▼';th.appendChild(s)}})}async function boot(){let au=['../data/assessments.json',...Array.from({length:12},(_,i)=>'../data/assessments_korea_addendum'+(i?'_'+(i+1):'')+'.json')];let [plants,nut,rda,evidenceData,...sets]=await Promise.all([j('../data/plants.json'),j('../data/plant_nutrition_v56.json'),j('../data/rda_food_composition_v56.json'),j('../data/public_evidence_records.json'),...au.map(j)]);evidenceMap=new Map((evidenceData?.records||[]).map(e=>[e.id,e]));plants=plants||[];let amap=new Map;sets.filter(Array.isArray).flat().forEach(a=>{if(!amap.has(a.plant_id))amap.set(a.plant_id,[]);amap.get(a.plant_id).push(a)});let nm=new Map((nut?.plants||[]).map(x=>[x.plant_id,x]));let rm=new Map((rda?.records||rda?.plants||[]).map(x=>[x.plant_id,x]));rows=plants.map(p=>{let a=best(amap.get(p.id)||[]),u=nm.get(p.id)||rm.get(p.id)||{};return{id:p.id,ko:p.ko||p.id,en:p.en||'',scientific:p.scientific||'',family:p.family||'',category:p.category||'',verdict:a?.verdict||'unresolved',verdictRank:VR[a?.verdict]||7,confidence:a?.confidence||'',directEvidence:(a?.evidence_ids||[]).map(id=>evidenceMap.get(id)).filter(e=>e&&['direct','exact_taxon','direct_observation'].includes(e.directness)).length,hasNutrition:Object.keys(u).length>0,water:n(u.water_g),fiber:n(u.fiber_g),calcium:n(u.calcium_mg),phosphorus:n(u.phosphorus_mg),ratio:n(u.calcium_phosphorus_ratio),protein:n(u.protein_g),potassium:n(u.potassium_mg),vitc:n(u.vitamin_c_mg)}});fill($('verdict'),rows.map(r=>r.verdict),v=>VL[v]||'판정 보류');fill($('category'),rows.map(r=>r.category));fill($('family'),rows.map(r=>r.family));render()}document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{let k=th.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1}render()});['q','verdict','category','family','nutrition'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));boot();</script></body></html>
