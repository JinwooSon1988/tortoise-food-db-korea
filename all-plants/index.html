function thumb(r){const im=imageMap.get(r.id);if(!im)return '<figure class="mthumb empty" aria-hidden="true">'+(en()?'Verified photo pending':'검증된 이미지 준비 중')+'</figure>';return '<figure class="mthumb"><img src="'+esc(im.image_url+'?width=160')+'" alt="" loading="lazy" decoding="async" width="160" height="160" title="'+esc((en()?'Photo ':'사진 ')+im.creator+' · '+im.license)+'"></figure>'}
function hint(g){return g==='A'?(en()?'Can be a main part of a varied diet':'다양한 식단의 주요 구성으로 활용'):g==='B'?(en()?'Use in limited amounts mixed with other foods':'다른 먹이와 섞어 제한적으로 활용'):g==='C'?(en()?'Occasional supplement, not a staple':'주식이 아닌 제한 급여'):g==='D'?(en()?'Exclude from planned feeding':'계획 식단에서는 제외'):(en()?'Assessment pending':'근거 확인 전 급여 판단 보류')}
function emptyHTML(){return '<div class="emptystate"><b>'+(en()?'No plants match these filters.':'조건에 맞는 식물이 없습니다.')+'</b><p>'+(en()?'A missing plant is not a safe plant. Try another name or clear the filters.':'목록에 없다고 안전하다는 뜻은 아닙니다. 다른 이름으로 검색하거나 필터를 초기화하세요.')+'</p><button type="button" class="resetbtn" data-reset>'+(en()?'Clear filters':'필터 초기화')+'</button></div>'}
function syncUrl(){const p=new URLSearchParams;[['q','q'],['verdict','v'],['category','c'],['family','f'],['nutrition','n']].forEach(([id,k])=>{const v=$(id).value.trim();if(v)p.set(k,v)});if(!(sortKey==='ko'&&sortDir===1))p.set('sort',sortKey+':'+sortDir);const qs=p.toString();history.replaceState(null,'',location.pathname+(qs?'?'+qs:''))}
function render(){let out=filtered().sort(cmp);const active=['q','verdict','category','family','nutrition'].some(id=>$(id).value.trim());
 $('summary').textContent=document.documentElement.lang==='en'?'Showing '+out.length+' of '+rows.length+' plants':'전체 '+rows.length+'종 중 '+out.length+'종 표시';
 $('reset').hidden=!active;
 document.querySelectorAll('.gradelegend button').forEach(b=>{const on=$('verdict').value===b.dataset.grade;b.setAttribute('aria-pressed',String(on));b.classList.toggle('dim',!!$('verdict').value&&!on)});
 $('mobilecards').innerHTML=out.length?out.map(r=>'<article class="mcard '+tone(r.verdict)+'">'+thumb(r)+'<div class="mbody"><h2><a href="../plant/'+encodeURIComponent(r.id)+'/">'+esc(en()?(r.en||r.ko):r.ko)+'</a></h2><span class="sci" lang="la">'+esc(r.scientific)+'</span><span class="mverdict"><b>'+esc(r.verdict==='보류'?(en()?'Hold':'보류'):r.verdict)+'</b>'+esc(gradeLabel(r.verdict))+'</span><span class="decisionhint">'+esc(hint(r.verdict))+'</span><div class="mmeta"><div><span>'+(document.documentElement.lang==='en'?'Evidence certainty':'근거 확실성')+'</span><b>'+esc(certaintyKo(r.confidence))+'</b></div><div><span>'+(document.documentElement.lang==='en'?'Direct evidence':'직접근거')+'</span><b>'+esc(r.directEvidence)+'</b></div><div><span>'+(document.documentElement.lang==='en'?'Nutrition data':'영양자료')+'</span><b>'+(r.hasNutrition?(en()?'Available':'있음'):(en()?'Unverified':'미확인'))+'</b></div></div></div></article>').join(''):emptyHTML();
 $('body').innerHTML=out.length?out.map(r=>'<tr><td class="name"><a href="../plant/'+encodeURIComponent(r.id)+'/">'+esc(en()?(r.en||r.ko):r.ko)+'</a><span class="sci" lang="la">'+esc(r.scientific)+'</span></td><td class="verdict '+tone(r.verdict)+'"><span class="tag"><b>'+esc(r.verdict==='보류'?'—':r.verdict)+'</b>'+esc(gradeLabel(r.verdict))+'</span></td><td>'+esc(certaintyKo(r.confidence))+'</td><td>'+esc(catLabel(r.category))+'</td><td>'+esc(r.family)+'</td><td lang="en">'+esc(r.en)+'</td><td class="num">'+val(r.ratio,2)+'</td><td class="num">'+val(r.fiber,2)+'</td><td class="num">'+val(r.calcium,1)+'</td><td class="num">'+val(r.phosphorus,1)+'</td></tr>').join(''):'<tr><td colspan="10">'+emptyHTML()+'</td></tr>';
 document.querySelectorAll('th[data-k]').forEach(th=>{th.querySelector('.sortmark')?.remove();if(th.dataset.k===sortKey){th.setAttribute('aria-sort',sortDir===1?'ascending':'descending');let s=document.createElement('span');s.className='sortmark';s.setAttribute('aria-hidden','true');s.textContent=sortDir===1?'▲':'▼';th.querySelector('button').appendChild(s)}else th.removeAttribute('aria-sort')});
 const so=$('sort'),key=sortKey+':'+sortDir;if([...so.options].some(o=>o.value===key))so.value=key;
 syncUrl()}
function localize(){document.querySelectorAll('[data-en]').forEach(el=>{if(!el.dataset.ko)el.dataset.ko=el.textContent;el.textContent=en()?el.dataset.en:el.dataset.ko});relabel($('category'),catLabel);relabel($('verdict'),v=>vl(v))}
function counts(){const c={};rows.forEach(r=>c[r.verdict]=(c[r.verdict]||0)+1);document.querySelectorAll('[data-count]').forEach(e=>{e.textContent=c[e.dataset.count]||0})}
function reset(){['q','verdict','category','family','nutrition'].forEach(id=>$(id).value='');render();$('q').focus()}
const CERTAINTY_KO={"A":"높음","B+":"다소 높음","B":"중간","B-":"중간 이하","C+":"다소 낮음","C":"낮음","C-":"매우 낮음","D+":"매우 낮음","D":"매우 낮음","D-":"매우 낮음"};const CERTAINTY_EN={"A":"High","B+":"Fairly high","B":"Moderate","B-":"Below moderate","C+":"Fairly low","C":"Low","C-":"Very low","D+":"Very low","D":"Very low","D-":"Very low"};function certaintyKo(c){const k=String(c||"").trim();return document.documentElement.lang==="en"?(CERTAINTY_EN[k]||"Not assessed"):(CERTAINTY_KO[k]||"미확정")}
async function boot(){let [plants,nut,rda,evidenceData,publicAssessments,images,englishCatalog]=await Promise.all([j('../data/plants.json'),j('../data/plant_nutrition_v56.json'),j('../data/rda_food_composition_v56.json'),j('../data/public_evidence_records.json'),j('../data/public_assessments.json'),j('../data/verified_plant_images_v56.json'),j('../data/i18n/en/catalog_en.json')]);const englishNames=new Map((englishCatalog?.plants||[]).map(p=>[p.id,p.name]));let sets=[publicAssessments];evidenceMap=new Map((evidenceData?.records||[]).map(e=>[e.id,e]));imageMap=new Map((images?.images||[]).map(im=>[im.plant_id,im]));plants=plants||[];let amap=new Map;sets.filter(Array.isArray).flat().forEach(a=>{if(!amap.has(a.plant_id))amap.set(a.plant_id,[]);amap.get(a.plant_id).push(a)});let nm=new Map((nut?.plants||[]).map(x=>[x.plant_id,x]));let rm=new Map((rda?.records||rda?.plants||[]).map(x=>[x.plant_id,x]));
 rows=plants.filter(p=>p.identity_status!=="candidate_name"&&(amap.get(p.id)||[]).length).map(p=>{let a=TV.representative(amap.get(p.id)||[]),g=TV.display(a).grade,u=nm.get(p.id)||rm.get(p.id)||{};return{id:p.id,ko:p.ko||p.id,en:englishNames.get(p.id)||p.en||'',scientific:p.scientific||'',aliases:p.aliases||[],searchAliases:p.search_aliases||[],family:p.family||'',category:p.category||'',verdict:g,verdictRank:VR[g]||5,confidence:a?.confidence||'',directEvidence:(a?.evidence_ids||[]).map(id=>evidenceMap.get(id)).filter(e=>e&&['direct','exact_taxon','direct_observation'].includes(e.directness)).length,hasNutrition:Object.keys(u).length>0,water:n(u.water_g),fiber:n(u.fiber_g),calcium:n(u.calcium_mg),phosphorus:n(u.phosphorus_mg),ratio:n(u.calcium_phosphorus_ratio),protein:n(u.protein_g),potassium:n(u.potassium_mg),vitc:n(u.vitamin_c_mg)}});
 fill($('verdict'),rows.map(r=>r.verdict),v=>vl(v));fill($('category'),rows.map(r=>r.category),catLabel);fill($('family'),rows.map(r=>r.family));counts();
 const p=new URLSearchParams(location.search);[['q','q'],['verdict','v'],['category','c'],['family','f'],['nutrition','n']].forEach(([id,k])=>{const v=p.get(k);if(v!=null&&(id==='q'||[...$(id).options].some(o=>o.value===v)))$(id).value=id==='q'?v.slice(0,80):v});
 const s=(p.get('sort')||'').split(':');if(s[0]&&document.querySelector('th[data-k="'+CSS.escape(s[0])+'"]')){sortKey=s[0];sortDir=s[1]==='-1'?-1:1}
 render()}
window.addEventListener('tfdblanguagechange',()=>{localize();render()});
document.querySelectorAll('th[data-k]').forEach(th=>th.querySelector('button').onclick=()=>{let k=th.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=['ratio','calcium','phosphorus','fiber'].includes(k)?-1:1}render()});
$('sort').addEventListener('change',e=>{const[k,d]=e.target.value.split(':');sortKey=k;sortDir=Number(d);render()});
$('q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(render,120)});
['verdict','category','family','nutrition'].forEach(id=>$(id).addEventListener('change',render));
document.querySelector('.gradelegend').addEventListener('click',e=>{const b=e.target.closest('button[data-grade]');if(!b)return;$('verdict').value=$('verdict').value===b.dataset.grade?'':b.dataset.grade;render()});
$('reset').onclick=reset;document.addEventListener('click',e=>{if(e.target.closest('[data-reset]'))reset()});
boot();</script></body></html>
