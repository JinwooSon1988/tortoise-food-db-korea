<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>최근 7일 식단 기록 | 거북밥 DB Korea</title><meta name="description" content="육지거북의 최근 7일 먹이 기록을 개체별로 저장하고 식단 다양성·반복·검증상태를 확인한다."><style>body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;max-width:860px;margin:auto;padding:20px;line-height:1.55;color:#17231b;background:#f7f9f6}a{color:inherit}select,input,button{font-size:16px;padding:10px;margin:4px 0;border:1px solid #ccd6cd;border-radius:10px;background:#fff}button{min-height:44px;cursor:pointer}.card{background:#fff;border:1px solid #dce4dc;border-radius:14px;padding:14px;margin:12px 0}.warn{padding:12px;background:#fff7df;border:1px solid #ecd48f;border-radius:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row label{flex:1;min-width:180px}.row select,.row input{width:100%;box-sizing:border-box}.metricgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.metric{border:1px solid #e1e7e1;border-radius:12px;padding:10px;background:#fbfcfb}.metric b{display:block;font-size:20px}.bar{height:10px;border-radius:999px;background:#edf1ed;overflow:hidden;margin:6px 0}.bar>span{display:block;height:100%;background:currentColor}.ok{color:#2d7a46}.mid{color:#92751f}.unknown{color:#68716b}.signal{padding:10px;border-radius:10px;background:#f5f7f5;margin:8px 0}.signal strong{display:block}.danger{border-color:#d8a7a7}.small{font-size:13px;color:#647067}.nav{margin-bottom:8px}table{width:100%;border-collapse:collapse;background:#fff}td,th{border-bottom:1px solid #e3e8e3;padding:9px;text-align:left;vertical-align:top}.pill{display:inline-block;border:1px solid #d9e0da;border-radius:999px;padding:2px 7px;font-size:12px;margin:2px 3px 2px 0}.orphan{background:#fff1f1;border-color:#e4bbbb}@media(max-width:700px){body{padding:14px}.row{display:block}.metricgrid{grid-template-columns:1fr 1fr}table{font-size:14px}td,th{padding:7px 5px}.hide-mobile{display:none}}</style><link rel="manifest" href="../manifest.webmanifest"></head><body><p class="nav"><a href="../index.html">← 거북밥 DB</a> · <a href="../meal/">오늘 식단</a> · <a href="../profile/">내 거북</a></p><h1>최근 7일 식단 기록</h1><div id="profileContext" class="card"></div><div class="card"><label>기록 보기 <select id="scope"><option value="active">현재 거북만</option><option value="all">모든 거북</option><option value="unassigned">과거 미지정 기록</option></select></label></div><p class="warn">이 페이지는 기록 패턴을 보여주는 도구다. 식물 종수·반복횟수·공개 검증상태는 관찰 신호이며 영양적 완전성 점수나 질병 위험 점수가 아니다.</p><div class="card"><div class="row"><label>날짜<input type="date" id="date"></label><label>먹이<select id="food"><option>먹이 목록 불러오는 중…</option></select></label></div><button id="add">기록 추가</button> <button id="wipe" class="danger">현재 보기의 7일 기록 삭제</button></div><div id="summary" aria-live="polite"></div><div id="rows"></div><script src="../profile-context.js"></script><script>
const KEY='tfd_weekly_v1';let names={},assessments=[],profiles=[];
const VERDICT={supported_mixed_diet:['🟢','근거 지지'],limited_mixed_diet:['🟡','제한적 혼합근거'],limited_supplement:['🟡','제한적 보조근거'],supplement_general_evidence:['🟡','일반 보조근거'],general_reptile_supplement:['🟡','초식 파충류 일반근거']};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localISO(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function cutoff(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6);return localISO(d)}
function makeId(){return crypto.randomUUID?crypto.randomUUID():'e-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function load(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(a))return[];let changed=false;for(const x of a){if(!x.event_id){x.event_id=makeId();changed=true}}if(changed)localStorage.setItem(KEY,JSON.stringify(a));return a}catch(e){return []}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
function activeProfile(){return window.TFDProfiles?.active?.()||null}
function profileById(id){return profiles.find(p=>p.id===id)||null}
function inScope(x,scope,p){if(scope==='all')return true;if(scope==='unassigned')return !x.profile_id;return !!p&&x.profile_id===p.id}
function assessmentFor(id){const rows=assessments.filter(a=>a.plant_id===id);return rows.find(a=>a.species_group==='Mediterranean_Testudo')||rows.find(a=>a.species_group==='Tortoise_general')||rows.find(a=>a.species_group==='Herbivorous_reptile_general')||null}
function statusInfo(id){if(id==='dandelion')return{level:'green',text:'🟢 혼합급여 적합'};if(id==='mallow')return{level:'unknown',text:'⚪ 식물동정 보류'};const a=assessmentFor(id);if(!a)return{level:'unknown',text:'U · 검증 미완료'};const m=VERDICT[a.verdict];return m?{level:m[0]==='🟢'?'green':'yellow',text:m[0]+' '+m[1]}:{level:'unknown',text:'U · 검증 미완료'}}
function updateProfile(){const p=activeProfile(),el=document.getElementById('profileContext');if(!p){el.innerHTML='<a href="../profile/">내 거북을 등록하면 기록을 개체별로 연결할 수 있다.</a>';return}const bits=[p.species_name||p.species,p.stage,p.weight_g?`${p.weight_g}g`:null].filter(Boolean);el.innerHTML='<b>현재 거북:</b> '+esc(p.name||'현재 거북')+(bits.length?' · '+bits.map(esc).join(' · '):'')+'<br><span class="small">새 기록은 이 개체 ID와 함께 저장된다.</span>'}
function render(){updateProfile();profiles=window.TFDProfiles?.all?.()||[];const p=activeProfile(),scope=document.getElementById('scope').value,cut=cutoff();const recent=load().filter(x=>x.date>=cut).sort((a,b)=>b.date.localeCompare(a.date)||String(a.food).localeCompare(String(b.food)));const shown=recent.filter(x=>inScope(x,scope,p));const counts={},dates=new Set(),green=new Set(),yellow=new Set(),unknown=new Set();for(const x of shown){counts[x.food]=(counts[x.food]||0)+1;dates.add(x.date);const s=statusInfo(x.food);(s.level==='green'?green:s.level==='yellow'?yellow:unknown).add(x.food)}const unique=Object.keys(counts),repeated=Object.entries(counts).filter(([,v])=>v>=3).sort((a,b)=>b[1]-a[1]);const orphans=shown.filter(x=>x.profile_id&&!profileById(x.profile_id));const totalUnique=Math.max(unique.length,1);const gp=Math.round(green.size/totalUnique*100),yp=Math.round(yellow.size/totalUnique*100),up=Math.round(unknown.size/totalUnique*100);let signals=[];if(!shown.length)signals.push('아직 분석할 기록이 없다.');else{if(dates.size<3)signals.push('7일 중 기록된 날이 '+dates.size+'일이다. 기록 공백이 많으면 실제 식단 패턴을 해석하기 어렵다.');if(repeated.length)signals.push('3회 이상 반복된 식물: '+repeated.map(([k,v])=>(names[k]||k)+' '+v+'회').join(', ')+'. 반복은 위험 판정이 아니라 편중을 확인하는 신호다.');if(unknown.size)signals.push('공개 검증이 미완료된 식물 '+unknown.size+'종이 기록돼 있다. 해당 상세페이지에서 근거와 식물동정 상태를 먼저 확인한다.');if(unique.length>=4)signals.push('서로 다른 식물 '+unique.length+'종이 기록돼 있다. 다양성은 확인되지만 이것만으로 영양적 완전성을 의미하지 않는다.');if(scope==='all'&&orphans.length)signals.push('삭제된 개체 ID에 연결된 기록 '+orphans.length+'건이 남아 있다. 기록 보존을 위해 자동 재배정하지 않는다.');}
const statusBar=`<div class="card"><b>공개 검증상태 분포 · 서로 다른 식물 기준</b><div class="metricgrid"><div class="metric ok"><b>${green.size}종</b>🟢 근거 지지</div><div class="metric mid"><b>${yellow.size}종</b>🟡 제한/일반 근거</div><div class="metric unknown"><b>${unknown.size}종</b>U·⚪ 미완료/보류</div><div class="metric"><b>${dates.size}일</b>7일 중 기록일</div></div>${unique.length?`<div class="bar ok"><span style="width:${gp}%"></span></div><span class="small">🟢 ${gp}% · 🟡 ${yp}% · U/⚪ ${up}% — 비율은 안전점수가 아니라 현재 공개 근거 상태의 분포다.</span>`:''}</div>`;
document.getElementById('summary').innerHTML='<div class="card"><b>7일 요약</b><br>기록 '+shown.length+'회 · 서로 다른 식물 '+unique.length+'종 · 기록일 '+dates.size+'/7일</div>'+statusBar+'<div class="card"><b>확인할 신호</b>'+signals.map(s=>'<div class="signal">'+esc(s)+'</div>').join('')+'</div>';
document.getElementById('rows').innerHTML=shown.length?'<table><thead><tr><th>날짜</th><th>먹이</th><th class="hide-mobile">검증상태</th><th class="hide-mobile">개체</th><th></th></tr></thead><tbody>'+shown.map(x=>{const pr=x.profile_id?profileById(x.profile_id):null;const pl=x.profile_id?(pr?esc(pr.name||'이름 없음'):'<span class="pill orphan">삭제된 개체</span>'):'<span class="pill">미지정</span>';return '<tr><td>'+esc(x.date)+'</td><td><a href="../plant/'+encodeURIComponent(x.food)+'/">'+esc(names[x.food]||x.food)+'</a></td><td class="hide-mobile">'+esc(statusInfo(x.food).text)+'</td><td class="hide-mobile">'+pl+'</td><td><button data-e="'+esc(x.event_id)+'">삭제</button></td></tr>'}).join('')+'</tbody></table>':'<p>현재 조건의 최근 7일 기록이 없다.</p>';document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{save(load().filter(x=>x.event_id!==b.dataset.e));render()})}
async function init(){try{const [plants,ass]=await Promise.all([fetch('../data/plants.json').then(r=>{if(!r.ok)throw new Error();return r.json()}),fetch('../data/assessments.json').then(r=>{if(!r.ok)throw new Error();return r.json()})]);for(const r of plants.filter(x=>x.id))names[r.id]=r.ko||r.id;assessments=Array.isArray(ass)?ass:[];document.getElementById('food').innerHTML=plants.filter(x=>x.id).map(r=>'<option value="'+esc(r.id)+'">'+esc(names[r.id])+'</option>').join('')}catch(e){document.getElementById('food').innerHTML='<option value="">먹이 목록을 불러오지 못함</option>'}render()}
document.getElementById('date').value=localISO();document.getElementById('add').onclick=()=>{const date=document.getElementById('date').value,food=document.getElementById('food').value;if(!date||!food)return;const a=load(),p=activeProfile();if(a.some(x=>x.date===date&&x.food===food&&((x.profile_id||null)===(p?p.id:null)))){alert('같은 날짜·같은 개체에 이미 기록된 식물이다.');return}a.push({event_id:makeId(),date,food,profile_id:p?p.id:null});save(a);render()};document.getElementById('wipe').onclick=()=>{const scope=document.getElementById('scope').value,p=activeProfile(),cut=cutoff();let label=scope==='all'?'모든 거북의':scope==='unassigned'?'과거 미지정':'현재 거북의';if(scope==='active'&&!p){alert('현재 선택된 거북이 없다.');return}if(!confirm(label+' 최근 7일 기록만 삭제할까요?'))return;save(load().filter(x=>!(x.date>=cut&&inScope(x,scope,p))));render()};document.getElementById('scope').onchange=render;init();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));
</script></body></html>
