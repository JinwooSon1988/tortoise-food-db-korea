function iso(d){return d.toISOString().slice(0,10)}; document.getElementById('date').value=iso(new Date());
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]').map(x=>{if(!x.event_id)x.event_id='e-'+x.date+'-'+x.food+'-'+Math.random().toString(36).slice(2);return x})}catch(e){return []}}
function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
function cutoff(){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6);return iso(d)}
function render(){
 let all=load().filter(x=>x.date>=cutoff()).sort((a,b)=>b.date.localeCompare(a.date));
 const p=window.TFDProfiles.active(), scope=document.getElementById('scope').value;
 let shown=all;
 if(scope==='active') shown=p?all.filter(x=>x.profile_id===p.id):[];
 else if(scope==='unassigned') shown=all.filter(x=>!x.profile_id);
 const scoped=shown;
 const counts={};scoped.forEach(x=>counts[x.food]=(counts[x.food]||0)+1);
 const unique=Object.keys(counts); const repeated=Object.entries(counts).filter(([k,v])=>v>=3).sort((a,b)=>b[1]-a[1]);
 document.getElementById('summary').innerHTML='<div class="card"><b>7일 요약</b><br>기록 '+scoped.length+'회 · 서로 다른 식물 '+unique.length+'종'+
 (repeated.length?'<br><b>반복이 많은 식물:</b> '+repeated.map(([k,v])=>NAMES[k]+' '+v+'회').join(', '):'<br>3회 이상 반복된 식물 없음')+
 '<br><small>반복횟수는 위험 판정이 아니라 식단 편중을 살펴보기 위한 신호다.</small></div>';
 document.getElementById('rows').innerHTML=scoped.length?'<table><thead><tr><th>날짜</th><th>먹이</th><th>검증상태</th><th></th></tr></thead><tbody>'+
 scoped.map((x,i)=>'<tr><td>'+x.date+'</td><td><a href="../plant/'+x.food+'/">'+NAMES[x.food]+'</a></td><td>'+PUBLIC[x.food]+'</td><td><button data-e="'+x.event_id+'">삭제</button></td></tr>').join('')+'</tbody></table>':'<p>최근 7일 기록이 없다.</p>';
 [...document.querySelectorAll('[data-e]')].forEach(b=>b.onclick=()=>{let a=load().filter(x=>x.event_id!==b.dataset.e);save(a);render();});
}
document.getElementById('add').onclick=()=>{let a=load();const p=window.TFDProfiles.active();a.push({event_id:(crypto.randomUUID?crypto.randomUUID():'e-'+Date.now()+'-'+Math.random().toString(36).slice(2)),date:document.getElementById('date').value,food:document.getElementById('food').value,profile_id:p?p.id:null});save(a);render();};
